# =============================================================================
# The blocking test suite (reusable workflow)
# =============================================================================
# The one definition of "the tests pass": ci.yml and release.yml both call this
# file, so CI and the release gate run the same checks.
#
# Not in here: the nf-test real and integration suites (advisory, in
# nightly.yml) and nf-core lint (no released version lints this repo; see
# .nf-core.yml). ruff and actionlint stay here so the release gate runs them too.
#
# `ref` is required and every checkout uses it: a called workflow otherwise sees
# the caller's `github.ref`, and the release gate would test a different commit
# from the one it tags. tests/test_release_workflow_graph.py checks this.
#
# Check names are `<caller job> / <job>`, e.g. `CI / Test suite / Python 3.10`.
# If branch protection is turned on, require only `All Tests` (ci.yml) and
# `Test Gate` (release.yml), not the matrixed leg names.
#
# Timeouts are runaway-job bounds, sized for the slower of the two callers.
# =============================================================================
name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        # Required, no default: see the header.
        description: 'Git ref (tag/branch/SHA) every job in this workflow checks out.'
        required: true
        type: string
      python-matrix:
        # ci.yml tests 3.10 + 3.11; release.yml passes '["3.10"]', since CI has
        # already covered 3.11 on the same commit.
        description: 'JSON array of Python versions for the python-tests matrix.'
        required: false
        default: '["3.10","3.11"]'
        type: string
      upload-coverage:
        # Coverage is a CI signal; release.yml turns it off (it passes no token).
        description: 'Upload the 3.10 coverage report to Codecov.'
        required: false
        default: true
        type: boolean
    secrets:
      CODECOV_TOKEN:
        # Named explicitly rather than `inherit`, which would also hand over
        # release.yml's Docker Hub credentials.
        description: 'Codecov upload token. Only ci.yml passes it.'
        required: false

# Least-privilege default token: read-only, as in every other workflow here.
permissions:
  contents: read

# No `concurrency:` block: a called workflow evaluates it in the caller's
# context and would join the group of the caller waiting for it.

env:
  NFTEST_VERSION: '0.9.0'
  # Declared here because `env:` does not cross a workflow_call boundary.
  # One cacheable plugins directory for nf-schema; setup-nextflow's plugin cache
  # path must match it.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Python unit tests
  # ============================================================================
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Every version string lives in requirements/. requirements/ci.txt includes
      # the files containers/segeval and containers/stare build from. The root
      # requirements.txt is an unpinned developer superset and is not installed.
      # torch-cpu.txt (for tests/test_valis_matching_bounds.py) is its own line so
      # its --index-url does not leak into another resolve.
      - name: Set up Python ${{ matrix.python-version }} and the CI stack
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          upgrade-pip: 'true'
          requirements: |
            requirements/ci.txt
            requirements/torch-cpu.txt

      - name: Generate test data
        # ci.txt is a superset of testdata.txt; re-running setup-python would
        # reset this matrixed job to 3.10.
        uses: ./.github/actions/generate-testdata
        with:
          setup-python: 'false'

      # MIRAGE_STRICT_SKIPS: any skip not in tests/expected_skips.txt fails the job,
      # and the collected count must clear tests/collected_floor.txt. Set at step
      # level so a later single-file pytest step is not held to the floor.
      # tests/coverage_floor.txt is a ratchet on bin/ coverage (only goes up). It
      # must hold only the integer, since `$(cat ...)` reads it; it sits a point
      # below the 3.10 measurement to leave room for the 3.11 leg.
      - name: Run Python unit tests
        env:
          MIRAGE_STRICT_SKIPS: '1'
        run: |
          pytest -v tests/ --ignore=tests/testdata --ignore=tests/modules --ignore=tests/subworkflows --ignore=tests/integration \
            --cov=bin --cov-report=xml --cov-report=term-missing --cov-fail-under="$(cat tests/coverage_floor.txt)"

      - name: Upload coverage
        if: ${{ inputs.upload-coverage && matrix.python-version == '3.10' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # Codecov being down must not fail the gate.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Nextflow stub tests + validation (fast, every push/PR)
  # ============================================================================
  # Both legs block: the 25.04.0 leg tests the minimum `manifest.nextflowVersion`
  # promises (NF25 and NF26 differ on config-scope `log` and CLI params).
  # ============================================================================
  nextflow-stub:
    name: NF ${{ matrix.nextflow-version }} stub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Nextflow
        # Cache, install, and provision the pinned nf-schema plugin.
        uses: ./.github/actions/setup-nextflow
        with:
          nextflow-version: ${{ matrix.nextflow-version }}

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Check all profiles parse without the gitignored site config
        # Guards against the strict-parser regression class: a committed profile
        # must never includeConfig a gitignored/missing file (breaks every
        # profile in CI). Runs with conf/ieo.config absent (it already is in CI).
        run: |
          bash tests/check_profiles_parse.sh

      - name: Check param surface consistency (config <-> schema <-> code)
        # Fails if a param is declared/used but undocumented in nextflow_schema.json
        # (or vice-versa) — keeps the parameter surface from drifting.
        run: |
          python3 tests/check_param_consistency.py

      - name: Run pipeline validation tests
        run: |
          bash tests/run_validation_tests.sh

      - name: lib/ probe — assert lib/*.groovy behaviour
        # The only unit-test surface for lib/*.groovy (nf-test's assertion
        # context cannot see lib/ classes). A failing assert fails the job.
        run: |
          nextflow run tests/lib_probe.nf -lib lib

      - name: Run pipeline with test profile (stub mode)
        # Container-free: stub blocks only `touch` outputs, and on a fresh
        # release tag the images do not exist yet (publish runs after the gate).
        run: |
          nextflow run . \
            -profile test \
            -stub \
            --outdir test_results_stub

      - name: Run pipeline with SHIPPED defaults (stub mode)
        # `-profile test` pins pixel_size and segmentation_model away from the
        # shipped defaults; this profile restores them and points `input` at the
        # one fixture with a real OME PhysicalSizeX/Y (`auto` needs it).
        run: |
          nextflow run . \
            -profile shipped_defaults_test \
            -stub \
            --outdir test_results_shipped_defaults

      - name: Verify work-directory cleanup and final-outputs-only publishing
        # Needs its own step: `cleanup` happens at session teardown, invisible
        # to pytest and nf-test. Includes the case that a FAILED run keeps its
        # work directory.
        run: |
          bash tests/cleanup_work.sh

      - name: Verify a cleanup_level pin reaches the publish gates (behavioural)
        # Only a run shows this: `nextflow config` prints the pinned value even
        # when the publish gates ignored it. Covers the profile pin, a `-c` pin
        # and a `-c` override.
        run: |
          bash tests/cleanup_level_pin.sh

      - name: Verify a -c pin of a frozen config param is refused, not ignored (behavioural)
        # Behavioural half of tests/test_frozen_config_params.py: a `-c` pin must
        # be refused; the same pin via -params-file and the CLI must arrive.
        run: |
          bash tests/frozen_config_pin.sh

      - name: Verify -resume reuses the cache (behavioural)
        # Behavioural counterpart to tests/test_resume_determinism.py. One resume
        # is enough: any re-run process outside {GENERATE_QC_REPORT,
        # AGGREGATE_SIZE_LOGS} fails it at once.
        run: |
          bash tests/resume_check.sh 1

      - name: Upload stub test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stub-results-nf-${{ matrix.nextflow-version }}
          path: |
            test_results_stub/
            test_results_shipped_defaults/
            .nextflow.log

  # ============================================================================
  # Documented-command launch leg (blocking)
  #
  # Its own job so its ~30 serial launches run beside the other legs. Runs every
  # documented command with `-stub -params-file params/dry_run.json` to catch
  # what only nf-schema sees (unknown flags, missing required params) beyond
  # tests/test_documented_commands_are_runnable.py's static check. `--dry_run`
  # exits before any process, so no containers are needed.
  # ============================================================================
  documented-commands:
    name: Documented commands launch (NF ${{ matrix.nextflow-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['25.04.0', 'latest-everything']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Nextflow
        uses: ./.github/actions/setup-nextflow
        with:
          nextflow-version: ${{ matrix.nextflow-version }}

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Verify every documented nextflow command launches
        run: |
          bash tests/documented_commands_launch.sh

  # ============================================================================
  # nf-test stub suite, sharded six ways (round-robin keeps shards even as
  # tests are added). Each shard has ~60 s of fixed setup, so more shards gain
  # little.
  # ============================================================================
  nf-test-stub:
    name: nf-test (stub, ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Nextflow and nf-test
        # Nextflow 25.04.0 by default (see the action); the edge release is
        # covered by nextflow-stub's matrix.
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test stub suite (this shard)
        # Container-free (-profile test) and stub-only (--tag stub): stub blocks
        # need no images. Real cases are tagged "real" and run in nightly.yml.
        run: |
          nf-test test --tag stub --profile test --verbose \
            --shard ${{ matrix.shard }}/6 --shard-strategy round-robin

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nf-test-stub-results-${{ matrix.shard }}
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # Security tests (blocking)
  # ============================================================================
  # tests/modules/segment_deepcell_token.nf.test needs
  # `-profile test,singularity`, so the `--tag stub --profile test` sweep cannot
  # collect it; this job runs it. No Singularity binary is needed: a tracked
  # placeholder .sif skips the pull, and the test only inspects `.command.run`.
  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Nextflow and nf-test
        # Same Nextflow pin as nf-test-stub (the action's default).
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Token-leak guard
        # DEEPCELL_ACCESS_TOKEN must be forwarded by name and its value never
        # reach .command.run (group-readable on shared HPC storage). The test
        # needs the variable set, or SEGMENT never reaches the guarded branch.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          nf-test test tests/modules/segment_deepcell_token.nf.test \
            --profile test,singularity --verbose

      - name: Assert the guard actually executed
        # A renamed file or --profile change would let nf-test exit 0 having
        # run nothing.
        env:
          DEEPCELL_ACCESS_TOKEN: dummy-token-value
        run: |
          # `grep -c` exits 1 on zero matches; zero is then rejected below.
          n=$(nf-test test tests/modules/segment_deepcell_token.nf.test \
                --profile test,singularity --dry-run 2>&1 \
              | grep -ci "DEEPCELL_ACCESS_TOKEN") || n=0
          echo "collected $n case(s)"
          test "$n" -ge 1

  # ============================================================================
  # Format suite — the readers CONVERT_IMAGE actually runs
  # ============================================================================
  # Its own job and interpreter: bioio-ome-tiff's tifffile pins conflict with
  # requirements/ci.txt on both python-tests legs, and bioio without that plugin
  # reads OME-TIFFs as a different reader than production. format-tests.txt
  # carries containers/convert's pins (tests/test_format_test_env_matches_the_convert_image.py);
  # 3.10 matches that image's base.
  #
  # `pytest tests/integration/formats` keeps this out of python-tests'
  # collection and tests/collected_floor.txt.
  #
  # Today every fixture is read via tifffile/h5py, never `_info_via_bioio`, so
  # this job is an install + pin-drift check on the bioio stack, not read
  # coverage of the bioio branch.
  format-tests:
    name: Format suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python and the convert image's reader stack
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          upgrade-pip: 'true'
          requirements: 'requirements/format-tests.txt'

      - name: Generate test data
        # format-tests.txt already has numpy, tifffile and h5py; re-running
        # setup-python would replace the reader stack under test.
        uses: ./.github/actions/generate-testdata
        with:
          setup-python: 'false'

      - name: Prove the reader stack is the one that shipped
        # Without bioio-ome-tiff the suite would silently test the wrong reader.
        run: |
          python -c "import bioio, bioio_ome_tiff, bioio_tifffile, h5py, tifffile; print(bioio.__version__, tifffile.__version__)"

      - name: Run the format suite
        run: |
          pytest -v tests/integration/formats

  # ============================================================================
  # Python lint (blocking): `ruff check` and `ruff format --check`. ruff is
  # pinned in requirements/lint.txt because a formatter release changes output.
  # ============================================================================
  ruff:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python and install ruff
        # Same pin as local use, so CI and `ruff check .` agree.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          requirements: 'requirements/lint.txt'

      - name: Run ruff check
        run: |
          ruff check .

      - name: Run ruff format --check
        # Separate step so the UI shows which of lint or format failed.
        run: |
          ruff format --check .

      - name: Run actionlint
        # Lints .github/workflows/** and .github/actions/**, inside the
        # blocking suite. Version, checksum and the shellcheck check live in
        # the action.
        uses: ./.github/actions/actionlint

  # ============================================================================
  # Documentation build (mkdocs --strict)
  # ============================================================================
  # Blocking. `--strict` plus mkdocs.yml's `validation:` block turns orphan
  # pages, dangling anchors and dead relative links into a failed build.
  docs:
    name: Docs build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: git-revision-date-localized warns on a shallow clone,
          # and `--strict` turns that warning into a failure.
          fetch-depth: 0

      - name: Set up Python and install the docs stack
        # docs/requirements.txt: docs tooling only, shared with Read the Docs.
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
          requirements: 'docs/requirements.txt'

      - name: Build the documentation
        run: |
          mkdocs build --strict --site-dir _site

      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site/

  # ============================================================================
  # Suite gate — the single result the callers depend on
  # ============================================================================
  # A workflow whose jobs all skipped concludes `success`, so callers cannot
  # trust this workflow's result alone. This job reads every leg's result and
  # fails on anything but success.
  #
  # `needs:` must list every other job in this file
  # (tests/test_release_workflow_graph.py checks it).
  suite-gate:
    name: Suite gate
    needs: [python-tests, nextflow-stub, documented-commands, nf-test-stub, security-tests, format-tests, ruff, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      # Accept only `success`. The explanation lives here, not in the script:
      # the aggregator guard reads the script body, comments included.
      - name: Check every suite job passed
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "::error::Python unit tests did not pass (result: ${{ needs.python-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.nextflow-stub.result }}" != "success" ]; then
            echo "::error::Nextflow stub tests did not pass (result: ${{ needs.nextflow-stub.result }})"
            exit 1
          fi
          if [ "${{ needs.documented-commands.result }}" != "success" ]; then
            echo "::error::The documented-command launch leg did not pass (result: ${{ needs.documented-commands.result }})"
            exit 1
          fi
          if [ "${{ needs.nf-test-stub.result }}" != "success" ]; then
            echo "::error::nf-test stub suite did not pass (result: ${{ needs.nf-test-stub.result }})"
            exit 1
          fi
          if [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "::error::Security tests did not pass (result: ${{ needs.security-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.format-tests.result }}" != "success" ]; then
            echo "::error::Format suite did not pass (result: ${{ needs.format-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.ruff.result }}" != "success" ]; then
            echo "::error::Ruff lint did not pass (result: ${{ needs.ruff.result }})"
            exit 1
          fi
          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::The docs build did not pass (result: ${{ needs.docs.result }})"
            exit 1
          fi
          echo "Every job in the shared test suite passed."
