# =============================================================================
# Nightly (advisory suites)
# =============================================================================
# The advisory suites live here, not in ci.yml, because a run's conclusion is
# the worst of any job in it: an advisory job in ci.yml would paint every push
# red while the gate was green. Nothing here is `continue-on-error`; a failing
# job fails this workflow's own status.
#
# `nf-test-real` runs on the schedule and on manual dispatch.
# `nf-test-integration` runs on manual dispatch only.
#
# `schedule:` fires only on the default branch, so `dev` gets real-suite
# coverage only from a manual dispatch with the branch selected.
#
# 05:17 UTC avoids the heavily queued top of the hour.
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Least-privilege default token: read-only, as in ci.yml.
permissions:
  contents: read

# Never cancel a nightly in flight: a half-run suite looks like a real failure.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NFTEST_VERSION: '0.9.0'
  # One cacheable plugins directory, as in _test-suite.yml.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Container images — the full static matrix, build-only
  # ============================================================================
  # Catches images that stop building for reasons outside the repo (a moved
  # apt repo, a yanked wheel, a deleted git host); ci.yml only builds images a
  # change touched. Build-only, and mostly served from the `type=gha` cache.
  containers:
    name: Container images (full matrix)
    uses: ./.github/workflows/containers.yml
    # All inputs defaulted: no `version` (never push), default-branch `ref`,
    # `scope: all`, no `only` filter.
    permissions:
      contents: read

  # ============================================================================
  # nf-test real suite
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Advisory only because this workflow gates no merge. Never add
    # `continue-on-error`: it makes `needs.<job>.result` report `success` for a
    # failed job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nextflow and nf-test
        # Nextflow 25.04.0 by default (see the action).
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only -- NOT on the schedule)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Manual dispatch only: keeps this 2-hour suite off the nightly schedule.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nextflow and nf-test
        # Nextflow 25.04.0 by default (see the action).
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/
