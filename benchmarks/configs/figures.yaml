# =============================================================================
# figures.yaml — EVERY figure, from one samplesheet, in one job.
#
#   mosaic    rounds x arms, small patches           benchmarks/reg_mosaic.py
#   overlay   one pair, large field, optional zoom   benchmarks/reg_overlay.py
#   zoom      whole slide + segmented cells          benchmarks/reg_zoom.py
#   crop      the segmented crop alone               benchmarks/reg_zoom.py --crop only
#   channel   one named channel, clean contrast      benchmarks/reg_crop.py
#
# Expanded by benchmarks/build_figure_plan.py, run by benchmarks/submit_figures.sh.
# Check what it expands to before you submit — it costs nothing:
#
#     python3 -m benchmarks.build_figure_plan --count
#     python3 -m benchmarks.build_figure_plan --config my_figures.yaml
#
# WHAT IS EXPENSIVE. Two things: one REGISTRATION per arm (hours, hundreds of GB —
# REGISTER has been measured at 483 GB) and one SEGMENTATION per method. Every other
# axis here — field size, patch size, output size, mask, ROI, overlay/checker,
# contrast mode, variant, channel, patient — is a re-render of slides already on
# disk, seconds each. So keep `arms` and `segmentation.methods` short and cross the
# rest freely. Each stage is .done-marked: a re-submit redraws without recomputing.
#
# THIS FILE DRAWS PICTURES; configs/arms.yaml PRODUCES THE NUMBERS. If the question
# is "which configuration wins", run the arms benchmark — it scores at reg_qc=2 and
# writes the tree ihc_method reads. Then point `arms:` below at those directories:
# nothing is re-registered and their QC is already on disk.
# =============================================================================

# ---- the expensive axes -----------------------------------------------------
# Either a name this grid knows how to BUILD (valis_high_micro2 | stare_high |
# ashlar), or {name: <label>, dir: <an existing run>} to draw from one you already
# have. A reused arm is never re-registered, and if it ran at reg_qc=2 its
# *_seg_qc.json is already there, so `numbers: scorer` costs nothing.
arms:
  - valis_high_micro2        # VALIS, memory_mode high, micro-registration 2 (shipped default)
  - stare_high               # STARE tiled, high preset
  - ashlar                   # the external comparator (tile/shift in options below)
  # - {name: valis_m0, dir: /beegfs/scratch/ieo7660/arms/valis_high_micro0}

# What everything downstream resumes from: segmentation, the channel crops, and the
# overlays when `overlay.arms` is not given. Pick the one you ship.
reference_arm: valis_high_micro2

segmentation:
  methods:                   # one pipeline run each; the zoom and crops show the difference
    - stardist               # what conf/ieo.config pins, with its model
    - instantseg             # the pipeline default; needs no extra assets
    # - cellsam              # NEEDS ITS WEIGHTS ON DISK. With cellsam_model_path unset,
                             # cellSAM.get_model() fetches them from users.deepcell.org.
                             # At IEO that host is unreachable from the compute nodes AND
                             # from login01 (ConnectTimeout, 2026-09-21) even though
                             # `singularity pull docker://` works, so it is that host
                             # specifically, not egress in general. Fetch the weights on a
                             # machine that can reach it, copy them under a bound path, and
                             # pin cellsam_model_path below. What it fetches, measured
                             # 2026-09-21 with a working token: the API returns a presigned
                             # S3 URL for models/cellsam-models_v1.2.tar.gz (1.7 GB), which
                             # cellSAM extracts into $HOME/.deepcell/models -- the directory
                             # conf/ieo.config already binds. A copy placed there is found
                             # as cached data, so the host is never contacted at all.
  params: {}                 # extra pipeline params for every segmentation run, e.g.
                             #   cellsam_model_path: /hpcnfs/.../models/cellsam/cellsam_base.pt

# ---- the free axes ----------------------------------------------------------
figures:
  mosaic:
    patch_um: [200]          # ~600 px at 0.325 um/px: nuclei resolvable, and a 9-round
                             # x 3-arm grid still fits on a page
    variants: 2              # two ROI sets to choose between; the picker is good, not psychic
    kinds: [overlay, checker]  # the magenta/cyan overlay AND the checkerboard: a sub-pixel
                             # shift the overlay blends away is a visible seam in the checker
    numbers: [image]         # auto | scorer | image | none. `image` computes Dice and the
                             # shift FROM THE CROP, so cells carry numbers with no reg_qc=2
                             # run; use `scorer` for arms that already ran at reg_qc=2

  overlay:
    field_um: [500, 2000]    # 500 um reads as tissue; 2000 um shows how far registration
                             # holds across a section
    zoom_um: [60]            # the inset that keeps single cells visible at 2000 um
                             # (0 = none); drawn for every field above
    variants: 3              # one crop is one roll of the dice

  zoom:                      # whole-slide overview + segmented cells
    field_um: [150, 300]     # 150 um = cells fill the panel; 300 um = some context
    masks: [both]            # cell | nuclei | both (cells yellow, nuclei cyan)
    crop: also               # none | also | only — `also` writes the crop beside the figure

  crop:                      # the segmented crop alone, for your own panels
    crop_px: [1024]          # output size; the tissue it covers is zoom.field_um above

  channels:                  # one named channel each
    names: [DAPI]            # must be in the samplesheet's `channels` for some slide
    colors: [white]          # cycled if shorter than `names`
    field_um: [150]
    crop_px: [1024]
    autoscale: [clean, percentile]   # draws the contrast comparison side by side rather
                             # than asking you to take `clean` on trust

# ---- shared settings --------------------------------------------------------
options:
  # A LIST of "Y,X" draws every figure above at each region — free, and it stops one
  # unlucky window from deciding the whole set. Empty = each figure picks its own,
  # which makes the sizes NOT comparable (every registered slide is on one canvas, so
  # a pinned ROI is the same tissue everywhere). Run once empty, read y,x out of the
  # manifest of the one you liked, paste it here, re-submit.
  roi: []
  patient: []                # a list draws each; empty = whatever the run holds
  seg_qc: 0                  # ONLY for arms this grid BUILDS: 1 runs them at reg_qc=2 so
                             # WARP_SEG_QC writes the Dice the mosaic can print. If the
                             # arms benchmark already ran, do NOT set this — point `arms:`
                             # at those directories and use `numbers: scorer` instead.
  ashlar_tile: 1024
  ashlar_shift_um: 500       # ASHLAR's drift budget. Patient 033 measured ~386 um apart;
                             # below the real drift ASHLAR silently discards tiles.
  outline_color: "#ffd400"   # cell outlines
  nuclei_color: "#00e5ff"    # nuclear outlines under mask: both
  outline_width: 2
  channel_label: DAPI        # the grey channel's legend name on the segmentation crops
  sat: 0.35                  # percent of the SIGNAL allowed to saturate (clean autoscale)
  bg_k: 3.0                  # black point = background median + k robust sigmas
  formats: png,pdf
  dpi: 100
