[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stare-registration"
version = "3.0.0"
description = "STARE: Scalable Tile-parallel Alignment by Robust Estimation — tile-parallel, JVM-free, non-rigid registration of cyclic-IF whole-slide images"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valerio Fassi" }, { name = "Yinxiu Zhan" }]
requires-python = ">=3.10"
# Pins follow requirements/constraints.txt at the repo root; the container and CI
# install from there, so a version here must equal the constraint or the build fails.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-image>=0.24",
    # Upper bound is load-bearing: tifffile releases after 2025.5.10 dropped zarr-2 support in
    # `aszarr` ("zarr 2.18.7 < 3 is not supported"), and zarr is held < 3 below. Measured
    # 2026-09-27 on Python 3.12: 2025.5.26 and 2026.9.20 fail, 2025.5.10 passes -- the same
    # version requirements/constraints.txt pins for mirage. Python 3.10 never saw it because
    # the newer releases do not support 3.10.
    "tifffile>=2023.4,<=2025.5.10",
    "zarr>=2.18,<3",
    "numcodecs<0.14",
    "imagecodecs>=2023",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
stare = "stare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
