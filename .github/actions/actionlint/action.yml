# actionlint (composite action): lints every workflow and composite action,
# including the shell in each `run:` via shellcheck.
#
# The version and checksum live here once so both callers stay in step. The
# tarball comes from the GitHub release and is checked against its published
# sha256 (no anonymous Docker Hub pull, which can be rate-limited).
#
# shellcheck is asserted present: actionlint silently skips shell linting
# without it.
name: 'actionlint'
description: 'Lint every GitHub Actions workflow and composite action with a pinned, checksum-verified actionlint.'

inputs:
  version:
    description: 'actionlint release version to run.'
    required: false
    default: '1.7.12'
  sha256:
    description: >-
      sha256 of actionlint_<version>_linux_amd64.tar.gz, from the release's own
      actionlint_<version>_checksums.txt. Bump it with the version, together.
    required: false
    default: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

runs:
  using: composite
  steps:
    - name: Run actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
        ACTIONLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        shellcheck --version > /dev/null
        url="https://github.com/rhysd/actionlint/releases/download"
        url="${url}/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -sSfL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
        echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
        tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
        "${RUNNER_TEMP}/actionlint"
