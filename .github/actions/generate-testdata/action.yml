# Generate the test fixtures (composite action). tests/testdata/ is gitignored,
# so CI has a fixture only if generate_complete_testdata.py writes it.
#
# `setup-python: 'false'` is for jobs that already installed requirements/ci.txt
# (a superset) into a matrixed interpreter; re-running setup-python would reset
# that job to 3.10.
name: 'Generate test data'
description: 'Generate the gitignored tests/testdata/ fixtures, optionally installing Python first.'

inputs:
  python-version:
    description: 'Python version to install (ignored when setup-python is false).'
    required: false
    default: '3.10'
  setup-python:
    description: >-
      Install Python and requirements/testdata.txt first. 'false' when the
      calling job has already installed a superset into the interpreter it
      wants — see the note above.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Python for test data generation
      # Versions come from requirements/constraints.txt, as for the images.
      if: inputs.setup-python == 'true'
      uses: ./.github/actions/setup-python-env
      with:
        python-version: ${{ inputs.python-version }}
        requirements: 'requirements/testdata.txt'

    - name: Generate test data
      shell: bash
      run: |
        python tests/testdata/generate_complete_testdata.py
