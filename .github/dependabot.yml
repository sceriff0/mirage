# Dependabot: grouped weekly updates for GitHub Actions, pip pins and base images.
version: 2
updates:
  # Both entries are needed: "/" covers only .github/workflows/; the composite
  # actions in .github/actions/* (which pin actions/cache, setup-python,
  # setup-nextflow, setup-nf-test) are read only when listed.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up:"
    labels:
      - "dependencies"
      - "github-actions"

  # Python pins live in /requirements (constraints.txt is shared by images and CI).
  # Inline `pip install pkg==x` in a Dockerfile (e.g. containers/convert) is not seen.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up:"
    labels:
      - "dependencies"
      - "python"

  # Container base images (`FROM ...`) in containers/*/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/containers/*"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up:"
    labels:
      - "dependencies"
      - "docker"
