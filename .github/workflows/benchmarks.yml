# =============================================================================
# benchmarks/ — the harness that lives only on this branch
# =============================================================================
# `benchmarking` is `dev` plus `benchmarks/`, so ci.yml's whole blocking gate
# already runs here (see its `on:` block for why that was added). THIS workflow
# covers the one thing that gate cannot: `benchmarks/tests/`, which exists on no
# other branch and is therefore in no other workflow's scope.
#
# THE INSTALL GOES THROUGH `requirements/`, NOT AN INLINE pip LINE. It used to
# read `pip install numpy==1.26.4 scipy==1.15.3 ...`, a second copy of pins that
# the CI redesign had just finished reducing to one: `requirements/constraints.txt`
# is the version authority and the container Dockerfiles read the same files.
# tests/test_ci_stack_pinned.py enforces that as a CLOSED rule over
# `.github/workflows/*.yml` AND `.github/actions/*/action.yml` -- no package list,
# so nothing can be forgotten out of it -- and this file failed it on the merge,
# in both directions (a version named in a workflow, and an install that reads no
# requirements file). Six pins were involved; every one of them is now the single
# copy in requirements/.
#
# requirements/ci.txt is the whole Python suite's environment, so it is a superset
# of what benchmarks/ imports: numpy, scipy, pandas, scikit-image, scikit-learn,
# tifffile and matplotlib all arrive through its `-r segeval.txt`, and pytest and
# pyyaml are named in it directly. requirements/lint.txt supplies the pinned ruff
# the Lint step below runs. benchmarks/tests/test_ci_installs_what_benchmarks_import.py
# resolves those files THROUGH `tests/ci_actions.py` and expands their `-r` chain,
# so it still fails if benchmarks/ grows a top-level import nothing installs.
# =============================================================================
name: benchmarks

on:
  push:
    branches: [benchmarking, 'bench/**']
  pull_request:
    branches: [benchmarking]

# Least-privilege default token, as in ci.yml.
permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    # 15, down from 60. The 60 was sized for the deleted synthetic ground-truth unit
    # rung, which ran the DISK+LightGlue COARSE front-end on CPU (23m33s locally). What
    # remains is the plan/analysis layer on tiny synthetic fixtures, ~5s locally. Left
    # well above the measured time so an under-provisioned runner does not flake, but low
    # enough that a hang fails in minutes instead of an hour.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # scikit-learn + matplotlib are for the ANALYSIS layer:
      # benchmarks/analysis/lib/regress.py imports sklearn.linear_model and
      # test_plotting.py imports matplotlib. Without them pytest dies during
      # COLLECTION with exit 2 -- four ImportErrors, zero tests run -- which is
      # how this job failed on 2026-08-26 and 2026-08-27 while looking like an
      # ordinary red build. Both now arrive through requirements/ci.txt's
      # `-r segeval.txt`, and the guard named in the header keeps them in step.
      #
      # torch + kornia + zarr/numcodecs/imagecodecs are not needed here -- they went
      # with the deleted synthetic ground-truth rung, which drove bin/tiled_*.py
      # IN-PROCESS, outside any container. Nothing under benchmarks/ executes a
      # pipeline entry point in CI any more. benchmarks/run_ashlar_arm.sh does, but
      # it runs on the cluster inside the images that already carry those deps --
      # see the note in the test file.
      # (requirements/ci.txt pulls zarr in anyway via `-r stare.txt`; that is the cost
      # of reading one shared file instead of maintaining a seventh pin list.)
      - name: Install
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          requirements: |
            requirements/ci.txt
            requirements/lint.txt

      - name: Test
        run: python -m pytest benchmarks/tests -v

      # WHOLE-DIRECTORY, AND NO `--no-force-exclude`. This step used to name five
      # paths explicitly and force ruff past an exclusion, because ruff.toml carried
      # `benchmarks/  # benchmarking scratch` -- a leftover from when the directory
      # was gitignored. :art: 0362eda deleted that exclusion (it was hiding 41 lint
      # errors, 15 of them in the production analysis files) and fixed what it
      # uncovered, so both halves of the old command are now false: there is no
      # exclusion to force past, and no reason to lint a subset.
      #
      # ci.yml's `ruff` job runs `ruff check .` over the same tree, so on
      # `benchmarking` this is redundant. It is kept for `bench/**`, which this
      # workflow covers and ci.yml does not.
      - name: Lint
        run: ruff check benchmarks/
