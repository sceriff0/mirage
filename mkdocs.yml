site_name: MIRAGE Pipeline
site_description: >-
  Nextflow DSL2 pipeline for multiplex whole-slide microscopy — illumination
  correction, registration, segmentation, single-cell quantification, and
  QuPath-compatible export.
site_author: Valerio Fassi, Yinxiu Zhan
site_url: https://mirage-pipeline.readthedocs.io/
repo_url: https://github.com/sceriff0/mirage
repo_name: sceriff0/mirage
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; Istituto Europeo di Oncologia — released under the MIT License.

# Author-facing helper files that should not become published pages
exclude_docs: |
  superpowers/
  _archive/
  perf/
  parallel_registration_design.md
  parallel_registration_research.md

# ---------------------------------------------------------------------------
# Link and navigation validation
# ---------------------------------------------------------------------------
# mkdocs 1.6 has no `error` level -- `mkdocs/config/defaults.py`'s _LogLevel accepts
# exactly warn / info / ignore. Raising these categories from their default `info`
# to `warn` is what makes `mkdocs build --strict` abort on them, which is how the
# BLOCKING `docs` job in .github/workflows/_test-suite.yml turns a dangling
# anchor into a failed build instead of a line nobody reads. (It sat in
# nightly.yml as an advisory job from 2026-09-02, while the build carried four
# pre-existing warnings; plan 12 cleared them and moved it back on 2026-09-03.)
#
# `nav.omitted_files: warn` is the orphan-page rule: a Markdown file in docs/ that
# no nav entry points at is unreachable from the site. The two former orphans
# (nextflow-26-bump.md, migration-2026-08-24.md) now live under docs/_archive/,
# which `exclude_docs` covers; docs/perf/ is excluded in place because bin/ and
# tests/ cite those notes by path.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  # Monochrome, matching the supplementary-figure design language in
  # docs/stylesheets/extra.css (white paper / black ink). `primary: black` and
  # `accent: grey` are the closest Material presets; extra.css overrides the
  # remaining hue-carrying variables in both schemes.
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - include-markdown
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Format validation: validation/format_validation.md
  - Pipeline: pipeline.md
  - Parameters: parameters.md
  - Inputs & outputs: outputs.md
  - Resources: resources.md
  - Illumination correction: basic_illumination.md
  - Incremental cycles: add_cycle.md
  - Registration QC: registration_qc.md
  - SpatialData & FlowPath: spatialdata.md
  - Development: developing.md
  - Citation: citation.md

# ---------------------------------------------------------------------------
# Appearance extras
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sceriff0/mirage
      name: MIRAGE on GitHub
  generator: false

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
