# =============================================================================
# CI (the blocking gate)
# =============================================================================
# Every job in this file is in the `all-tests` gate, so a green run means a
# green gate. Advisory suites belong in nightly.yml, never here behind a missing
# `needs:` entry or `continue-on-error` (tests/test_release_workflow_graph.py).
#
# The blocking suites live in `_test-suite.yml`, which this file and release.yml
# both call, so the two gates cannot drift apart.
#
# There is no nf-core lint job: no released nf-core/tools version lints this
# repo (`manifest.name` has no `<org>/`); see .nf-core.yml.
# =============================================================================
name: CI

on:
  push:
    # `benchmarking` is here because it carries the WHOLE pipeline (it is dev plus
    # benchmarks/), and until 2026-09-01 none of the pipeline's guards ran on it --
    # only the benchmarks workflow did. Four pipeline guards broke there during the
    # dev reconciliation (CI job timeouts, an unpinned imaging stack, references to
    # deleted COARSE front-ends, fixture producers) and CI caught none of them; they
    # were found by running pytest by hand. A branch that carries the pipeline needs
    # the pipeline's gate. That reason is unchanged by the CI redesign; the sentence
    # that USED to sit here describing how it stays cheap was not, and was rewritten
    # rather than merged -- it named a job, a mechanism and a line number that the
    # redesign deleted.
    #
    # This still does NOT pull in the expensive leg, but for a DIFFERENT reason than
    # before. `nf-test-real` no longer lives in this file at all -- Phase 4 moved it,
    # with `nf-test-integration`, into `.github/workflows/nightly.yml`, so there is no
    # branch `if:` here to exempt `benchmarking` from. nightly.yml is triggered by
    # `schedule:` and `workflow_dispatch:` only, and `schedule:` runs the DEFAULT
    # BRANCH's workflow file against the DEFAULT BRANCH -- so the two-hour advisory
    # suites can reach this branch only if a human dispatches them at it. Adding
    # `benchmarking` here cannot start them.
    #
    # What this branch DOES get is the whole blocking gate: `all-tests` below needs
    # `test-suite` and `containers`. `test-suite` is `.github/workflows/_test-suite.yml`,
    # which is where Phase 5 moved the five blocking suites that this comment used to
    # list by job name -- python-tests, nextflow-stub, nf-test-stub, security-tests,
    # ruff -- and it enumerates them itself in its own `suite-gate`. `containers` is
    # `containers.yml` at `scope: changed` (Phase 6): on a branch that touches no
    # `containers/` build context it resolves to an empty matrix and costs nothing,
    # and on one that does, a broken Dockerfile blocks the merge here instead of
    # surfacing on the release path.
    branches: [ main, dev, benchmarking ]
  pull_request:
    branches: [ main, dev, benchmarking ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Least-privilege default token: read-only. Hardens against a compromised
# action writing to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes; a new push to a PR
# branch kills the previous in-flight run instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level `env:`: every job here is a reusable-workflow call, and
# `env:` does not cross a workflow_call boundary.

jobs:
  # ============================================================================
  # The blocking test suite (reusable workflow)
  # ============================================================================
  # See `.github/workflows/_test-suite.yml` for the jobs.
  #
  # `ref: ${{ github.sha }}` is required: a called workflow checks out the
  # caller's `github.ref`, not what the caller checked out, so the commit is
  # pinned here (on a PR, the merge commit).
  #
  # `secrets:` names only the Codecov token rather than `inherit`.
  test-suite:
    name: Test suite
    uses: ./.github/workflows/_test-suite.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Container images — build only what this change touched, and prove it runs
  # ============================================================================
  # `scope: changed` builds only images whose build context (or a requirements
  # file their Dockerfile COPYs) changed; an untouched PR gets an empty matrix.
  #
  # This caller job has no `if:` and never skips; a skipped matrix job inside
  # the called workflow still concludes `success`, so the gate can require it.
  containers:
    name: Container images
    uses: ./.github/workflows/containers.yml
    with:
      # Pin the commit, as for `test-suite` above.
      ref: ${{ github.sha }}
      scope: changed
      # No `version:`: an empty version means build, never push.
    permissions:
      contents: read

  # ============================================================================
  # All tests passed gate
  # ============================================================================
  all-tests:
    name: All Tests
    # `test-suite` reports all of `_test-suite.yml`; its own `suite-gate`
    # rejects an all-skipped suite, which would otherwise conclude `success`.
    needs: [test-suite, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        # `skipped` is not a pass: a needed job that stops running must block.
        run: |
          if [ "${{ needs.test-suite.result }}" != "success" ]; then
            echo "The shared test suite did not pass (result: ${{ needs.test-suite.result }})"
            exit 1
          fi
          if [ "${{ needs.containers.result }}" != "success" ]; then
            echo "The container build did not pass (result: ${{ needs.containers.result }})"
            exit 1
          fi
          echo "All required tests passed!"
