[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drape-registration"
version = "2.0.0"
description = "DRAPE: Distributed Robust Alignment by Piecewise Estimation — tile-parallel, JVM-free, non-rigid registration of cyclic-IF whole-slide images (formerly STARE)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valerio Fassi" }, { name = "Yinxiu Zhan" }]
requires-python = ">=3.10"
# Pins follow requirements/constraints.txt at the repo root; the container and CI
# install from there, so a version here must equal the constraint or the build fails.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "tifffile>=2023.4",
    "zarr>=2.18,<3",
    "numcodecs<0.14",
    "imagecodecs>=2023",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
drape = "drape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
