# CI for the STANDALONE DRAPE repository (github.com/sceriff0/drape).
# Inside mirage this file is inert: GitHub reads workflows only from the repository-root
# .github/, and mirage's own CI tests packages/drape through requirements/ci.txt. It lives here
# so `git subtree split -P packages/drape` carries it into the standalone repository unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest -q
