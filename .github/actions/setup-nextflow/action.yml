# Set up Nextflow (composite action): cache ~/.nextflow, install the pinned
# Nextflow, cache the plugins directory, provision nf-schema into it.
#
# Caching rules for every cache in this repo:
#   1. hashFiles() targets manifests (requirements/*, nextflow.config), never a
#      source tree; a source hash misses on every commit that matters.
#   2. A cache entry is immutable: the first save under a key wins, later saves
#      no-op. Jobs that install different amounts must not share a key.
#   3. Caches are scoped to repository + ref, so a PR cannot poison main's.
#
# The ~/.nextflow key is just OS + arch + Nextflow version, with no restore-keys:
# its contents depend on nothing else. The `latest-everything` leg is
# effectively uncached (the key never changes); a date in the key would only
# write a never-reused entry per day.
#
# Do not cache ~/.nf-test here. nf-core/setup-nf-test caches it under its own
# nf-test-version key; a second cache restores the old binary on an nf-test bump
# and its install step then fails with "dest already exists".
#
# tests/test_ci_cache_keys.py checks these rules; the guards resolve local
# actions through tests/ci_actions.py, so steps may live here rather than inline.
name: 'Set up Nextflow'
description: >-
  Cache and install Nextflow, then cache and provision the nf-schema plugin
  version pinned in nextflow.config.

inputs:
  nextflow-version:
    description: >-
      Nextflow version to install. '25.04.0' is the supported release and the
      minimum `manifest.nextflowVersion` promises; 'latest-everything' is the
      edge leg of the stub matrix.
    required: false
    default: '25.04.0'
  plugins:
    description: >-
      Cache and provision Nextflow plugins (nf-schema). 'false' only for a job
      that never runs the pipeline — the nf-core structural lint job is the one
      such job, and giving it a plugin download would add a network dependency
      it does not use.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Cache Nextflow
      uses: actions/cache@v4
      with:
        # ~/.nextflow only; see the header for why not ~/.nf-test.
        path: ~/.nextflow
        key: ${{ runner.os }}-${{ runner.arch }}-nextflow-${{ inputs.nextflow-version }}

    - name: Install Nextflow
      uses: nf-core/setup-nextflow@v2
      with:
        version: ${{ inputs.nextflow-version }}

    - name: Cache Nextflow plugins
      if: inputs.plugins == 'true'
      uses: actions/cache@v4
      with:
        # Matches the caller's NXF_PLUGINS_DIR (the same mechanism docs/usage.md
        # describes for air-gapped clusters).
        path: ${{ github.workspace }}/.nextflow-plugins
        # nextflow.config declares the plugin, so the key rotates with the pin.
        # A stale restore-key hit is safe: the provision step below fills gaps.
        key: ${{ runner.os }}-nf-plugins-${{ hashFiles('nextflow.config') }}
        restore-keys: |
          ${{ runner.os }}-nf-plugins-

    - name: Provision Nextflow plugins
      # Install nf-schema up front so a registry outage fails here, not mid-run.
      # The version is read from nextflow.config so CI and the pipeline agree.
      if: inputs.plugins == 'true'
      shell: bash
      run: |
        nextflow plugin install "$(sed -n "s/.*id '\(nf-schema@[0-9.]*\)'.*/\1/p" nextflow.config)"
