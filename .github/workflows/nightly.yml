# =============================================================================
# Nightly (advisory suites)
# =============================================================================
# THIS WORKFLOW EXISTS SO THAT A RED `ci.yml` MEANS SOMETHING.
#
# `nf-test-real` and `nf-test-integration` used to live in ci.yml. Both were
# advisory in the only way this repository permits -- absent from the `all-tests`
# gate's `needs:` list, never `continue-on-error` -- and that was correct as far
# as the GATE went. It was not enough for the RUN. A GitHub Actions run's
# conclusion is the worst conclusion of any job in it, gate membership included
# or not, so on every push to main or dev the blocking gate passed, `nf-test
# (real)` failed, and the run reported `failure`: a red X on the commit, a red
# badge, a red PR checks list. Verified on 84cc53f. That trains people to ignore
# red, which is the failure mode the whole CI redesign is against.
#
# Moving the two jobs into their own workflow fixes it at the level it is broken:
# ci.yml is now green exactly when its gate is green, and the advisory suites
# keep their own honest history to trend. Nothing here is `continue-on-error` and
# nothing here is `|| true` -- a nightly job that fails FAILS, visibly, in this
# workflow's own status. That is the point of giving it a status of its own.
#
# -----------------------------------------------------------------------------
# GREEN as of run 33742731796, 2026-09-03. THE MOVE WAS A DEFERRAL; IT IS DISCHARGED.
# -----------------------------------------------------------------------------
# `nf-test (real)` was RED when it was moved here, and this section carried the
# list of why. Both advisory legs are green now, on this exact workflow file:
#
#   run 33742731796, workflow_dispatch against release/p07-formats, 2026-09-03
#   https://github.com/sceriff0/mirage/actions/runs/33742731796
#     nf-test (real)         SUCCESS: Executed 29 tests in 1245.405s
#     nf-test (integration)  SUCCESS
#
# The baseline it is measured against is run 33633986188 (2026-09-02, plan 01):
# `FAILURE: Executed 28 tests in 1226.191s (14 failed)`, in five families. 29 not
# 28 because one case was ADDED on the way (the expanded-quantification companion
# in (5) below).
#
# DO NOT DELETE THE HISTORY BELOW WITHOUT REPLACING THE JOB'S GATE. Every entry
# names a defect that a green `nf-test test --tag stub` could not see, which is
# the property that made this suite worth keeping honest in the first place.
#
# FIXED 2026-09-02 (release 1.0.0, plan 01 -- suite truth):
#
#   1. `tests/testdata/P001_nuclei_mask.tif` was EMPTY on the runner, so
#      `MIRAGE:READ_SEGMENTED_CHECKPOINT:EXTRACT_NUCLEI_PROPERTIES (P001)` aborted
#      with `tifffile.TiffFileError: not a TIFF file b''`. It was one of FIVE
#      fixtures TRACKED AT ZERO BYTES. FOUR of the five -- P001_image.tiff,
#      P001_merged_quant.csv, P001_nuclei_mask.tif, P001_pyramid.ome.tiff -- are
#      generated by tests/testdata/generate_complete_testdata.py now. The fifth,
#      dummy_singularity.sif, is STILL zero bytes and is meant to be: Nextflow's
#      Singularity engine only needs the path to exist to treat the image as
#      already-local and skip `singularity pull`, nothing ever opens it, and it is
#      allowlisted in tests/test_fixtures_have_a_producer.py's EMPTY_ON_PURPOSE
#      with that reason. That guard no longer accepts any OTHER fixture that
#      exists but cannot be opened.
#   2. The exported GeoJSON carried 0 features against 20 rows in the
#      quantification CSV. This was NOT downstream of (1): the failing case is
#      tests/modules/export_geojson.nf.test's real test, whose only inputs are
#      sample_merged_quant.csv and sample_contours.json. Two fixture defects -- a
#      quantification CSV with `centroid_x`/`centroid_y` where every producer
#      writes `x`/`y`, and a contours JSON that wrapped each ring in a
#      `coordinates` key. Both fixed in the generator, and pinned in the BLOCKING
#      suite by tests/test_export_geojson_fixture_contract.py.
#
# FIXED 2026-09-03 (release 1.0.0, plan 07 task 0 -- the remaining five families):
#
#   3. The preprocessed and registered `.ome.tif` outputs were produced and never
#      PUBLISHED, so both tests/integration/full_pipeline.nf.test cases failed
#      walking csv/preprocessed.csv and csv/registered.csv. Their publishDir
#      entries (conf/modules.config, APPLY_PROFILES and REGISTER) carry
#      `enabled: params.cleanup_level == 'none'`, a PLAIN boolean, which Nextflow
#      evaluates EAGERLY where it appears -- before `profiles {}` runs -- so
#      conf/test.config's own pin never reaches it. Measured statically:
#      `nextflow config -profile test,docker` reports `cleanup_level = 'none'` and
#      STILL renders 15 gates `enabled:false`; with the value on the command line,
#      0. Fixed test-side, by setting `cleanup_level = 'none'` in those two cases'
#      `params {}` -- nf-test passes a params block as a -params-file, which IS in
#      the binding before conf/modules.config is parsed. THE TRAP ITSELF IS
#      UNCHANGED and is still documented in CLAUDE.md; only these two tests now
#      reach past it.
#   4. EIGHT of the fourteen were assertions treating an nf-test output path as a
#      File. `process.out.<x>.get(0).get(1)` is a String, so `.size()` returned the
#      LENGTH OF THE PATH (161, for a 161-character work path), `.readLines()` split
#      the path rather than the file, and `.name`/`.toFile()` did not exist at all.
#      Every site now wraps with `file(...)`. Guarded FORWARD, in the blocking
#      pytest suite, by tests/test_real_assertions_do_not_treat_strings_as_paths.py
#      -- `--tag stub` cannot see a `real` case, which is why this family survived
#      for as long as it did.
#   5. One stale assertion against a default that moved: tests/modules/quantify
#      asserted 11 columns and got 5, because `expanded_quantification` ships
#      false and Median alone is computed. The test now asserts the shipped five
#      (and that no `: Mean` / `: Sum` column is present), and a SECOND real case
#      was added that turns `expanded_quantification` on and asserts all 11 -- the
#      flag is rendered from a `script:`-time ext.args closure, so no stub run can
#      reach it.
#   6. `pixel_size` reached EXPORT_GEOJSON as the literal string `null` and the
#      process exited 1 (`PixelSizeError: --pixel_size 'null' is neither a number
#      nor 'auto'`). A TEST defect, not a pipeline one: the postprocess
#      subworkflow's real case builds its metas by hand and set pixel_size in
#      `params {}` only, but EXPORT_GEOJSON and EXPORT_SPATIALDATA read
#      `meta.pixel_size` -- deliberately, since neither is handed the source image
#      and so neither can resolve `auto` itself. Production always has the key
#      (lib/Meta.groovy's fromCheckpointRow refuses a row without it).
#   7. The synthetic-data segmentation wall. StarDist's 2D_versatile_fluo returned
#      0 nuclei, giving a 145-byte (all-zero) cell mask. MEASURED CAUSE, on the
#      generated file rather than inferred: P001_ref.ome.tiff's DAPI channel is 40
#      gaussian blobs of radius 6-13 in 128x128 merged with np.maximum, and forms
#      37.7% foreground in exactly ONE connected component -- there are no separate
#      nuclei in it to find. That density is what makes it a good REGISTRATION
#      fixture (VALIS needs the shared texture), so it was left alone and
#      segmentation got its own image: P001_seg_nuclei.ome.tiff, 256x256, 45
#      non-touching nuclei 10-18 px across, written and ASSERTED by
#      generate_complete_testdata.py section 10. Both cases pass on the real
#      StarDist container in the run above.
#
# A SIXTH family appeared only after (4) was fixed, because every one of its
# assertions had a MissingPropertyException standing in front of it and had
# therefore never been evaluated: a comma-separated channels manifest asserted as
# newline-separated, a `qc` emit that globs TWO files handed to `file()` as a
# List, and -- twice -- an unqualified `collect` inside a `with(...)` block, which
# does not reach the delegate List and hands the closure the whole list as `it`.
# Fixed in the same task; the stub-tagged cases in those same files already used
# the working form. Recorded here because it is the shape of the thing: a broken
# assertion can hide another broken assertion indefinitely.
#
# `nf-test (integration)` NEVER CONTRIBUTED AN INDEPENDENT FAILURE. It ran 5 tests
# and failed 2, and those 2 were test ids 1387f758 and 47ddb28b -- the same two
# cases as (3), in the same file. tests/integration/full_pipeline.nf.test carries
# a file-level `tag "integration"` and a per-test `tag "real"`, so four of its five
# cases are collected by BOTH legs, and (3) turned both jobs together.
#
# WHAT IS LEFT BEFORE THIS JOB GOES BACK IN ci.yml's `all-tests` GATE. Being green
# once is not the bar; two things are still open and neither is a test failure:
#   - the `docs` job in this same workflow is RED, on broken intra-doc anchors in
#     docs/parameters.md and docs/resources.md (`Aborted with 4 warnings in strict
#     mode!`). It is unrelated to the suites -- it fails identically on
#     release/p01-suite-truth -- but it makes this workflow's own status red, so
#     the "advisory suites are green" claim has to be read per-job for now.
#   - `dev` still has NO real-suite coverage: `schedule:` fires on the default
#     branch only. See the note further down.
#
# -----------------------------------------------------------------------------
# GATING, AND WHAT WAS PRESERVED
# -----------------------------------------------------------------------------
# `nf-test-integration` did NOT run on every push in ci.yml either: it carried
# `if: github.event_name == 'workflow_dispatch'`, i.e. it ran only when a human
# fired the workflow by hand. That is preserved EXACTLY -- the same `if:` is on
# the job below, so the nightly schedule runs `nf-test-real` only and the
# integration suite is still a deliberate, manual act. Moving it here without
# that condition would have quietly promoted a manually-triggered 2-hour suite
# into something that runs unattended every night.
#
# `nf-test-real` ran on `push` to main AND dev in ci.yml. Here it runs on the
# schedule and on a manual dispatch, which is the trade this move makes: the
# signal is one run per day instead of one per push, and in exchange a push's
# status tells the truth about the gate.
#
# BE PRECISE ABOUT WHAT dev LOSES. `schedule:` fires on the DEFAULT BRANCH ONLY --
# GitHub runs the workflow file as it exists on `main`, against `main`. So dev's
# real-suite coverage drops from "every push" to ZERO, and the only way to run the
# real suite against dev is a manual `workflow_dispatch` with the branch selected.
# That is a real reduction and it is being made deliberately: the suite is red
# today (see above), so what dev is losing is a signal nobody could read anyway,
# and restoring per-push coverage on a branch is the wrong shape for a suite that
# takes two hours. If dev needs it back once the suite is green, the fix is a
# `push:` trigger here with `branches: [dev]` -- a decision to take then, on a
# green suite, not now.
#
# 05:17 UTC is deliberately not on the hour: GitHub's scheduler queues heavily at
# :00 and can delay or drop a run entirely under load.
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Least-privilege default token: read-only, as in ci.yml.
permissions:
  contents: read

# Never cancel a nightly in flight: a half-run advisory suite reports a failure
# that is indistinguishable from a real one, which is the exact confusion this
# workflow exists to remove.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NFTEST_VERSION: '0.9.0'
  # Same mechanism as ci.yml and release.yml: one cacheable plugins directory
  # instead of ~/.nextflow/plugins, which is also the air-gapped NXF_PLUGINS_DIR
  # path docs/usage.md documents.
  NXF_PLUGINS_DIR: ${{ github.workspace }}/.nextflow-plugins

jobs:
  # ============================================================================
  # Container images — the full static matrix, build-only
  # ============================================================================
  # ADDED 2026-09-01 (CI redesign, Phase 6). THIS IS THE ONLY MECHANISM IN THE
  # REPOSITORY THAT CAN DETECT AN IMAGE WHICH STOPPED BUILDING FOR A REASON OUTSIDE
  # THE REPOSITORY, and that is a failure this project has already had: an apt repo
  # that moves, a wheel that is yanked, a git host that deletes a project.
  # containers/regqc carried `pip install git+https://github.com/sceriff0/cudipy.git`
  # for months after that repository ceased to exist -- the image could not be built
  # AT ALL -- and nothing noticed, because `build-images.yml` only ran when someone
  # pushed a change to containers/**. ci.yml's changed-only build closes the "a PR
  # broke it" half; this closes the "nobody touched it and it broke anyway" half.
  # Neither alone is enough.
  #
  # Build-only, and build-only is the whole cost story: no `version:` input means
  # containers.yml resolves push=false, and ten of the eleven images come back from
  # the `type=gha` layer cache in minutes. The cost is paid only by whichever image's
  # upstream actually broke -- which is exactly the run you want to be paying for.
  #
  # ADVISORY BY LOCATION, like everything else here: nothing in this workflow is in
  # any merge gate, and nothing here is `continue-on-error` or `|| true`. A nightly
  # image build that fails FAILS, visibly, in this workflow's own status.
  containers:
    name: Container images (full matrix)
    uses: ./.github/workflows/containers.yml
    # Every input defaulted on purpose: no `version` (build only, never push), no
    # `ref` (the default branch), `scope: all` (all eleven from
    # containers/images.json), no `only` filter.
    permissions:
      contents: read

  # ============================================================================
  # nf-test real suite
  # ============================================================================
  nf-test-real:
    name: nf-test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # ADVISORY BY LOCATION, and by nothing else. There is no `continue-on-error`
    # here and there must never be one: it makes `needs.<job>.result` report
    # `success` for a job that failed, which is strictly worse than `|| true`
    # (at least `|| true` is local and visible on one line). This job is advisory
    # because it is in a workflow no merge is gated on -- and it still reports its
    # true colour, which is the whole trade.
    #
    # The header's cause (7) was diagnosed here for a long time as "StarDist's
    # built-in 2D_versatile_fluo detects 0 nuclei in the smooth synthetic test
    # blobs even at a low prob_thresh", with the proposed fixes being to bundle a
    # real nuclei crop or to weaken the assertions to "runs without error".
    # Neither was needed and the diagnosis was half right: the model was fine and
    # the THRESHOLD was fine -- the fixture had no separate nuclei in it at all
    # (one connected component covering 37.7% of the frame). A synthetic image
    # with non-touching nuclei segments correctly. Kept here rather than deleted
    # because "the model cannot do it" was the wrong conclusion drawn from the
    # right symptom, twice.
    #
    # Put this job back in ci.yml's `all-tests` gate once this whole workflow is
    # green -- both suites pass as of run 33742731796; the `docs` job does not.
    # That is the end state; this workflow is where it waits, not where it belongs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nextflow and nf-test
        # The action pins Nextflow to the supported release by default: nf-test
        # 0.9.0's generated test wrappers do not compile under edge Nextflow's
        # strict parser.
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test real suite
        run: |
          nf-test test --profile test,docker --tag real --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nf-test-real-results
          path: |
            .nf-test/
            tests/output/

  # ============================================================================
  # nf-test integration suite (manual trigger only -- NOT on the schedule)
  # ============================================================================
  nf-test-integration:
    name: nf-test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # PRESERVED VERBATIM from ci.yml. This job has never run on a schedule or on
    # a push; it ran only when someone dispatched the workflow by hand, and it
    # still does. Deleting this line would turn a deliberate 2-hour manual suite
    # into an unattended nightly one, which is a change nobody asked for and
    # which the move itself makes very easy to do by accident.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Nextflow and nf-test
        # The action pins Nextflow to the supported release by default: nf-test
        # 0.9.0's generated test wrappers do not compile under edge Nextflow's
        # strict parser.
        uses: ./.github/actions/setup-nf-test
        with:
          nf-test-version: ${{ env.NFTEST_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Generate test data
        uses: ./.github/actions/generate-testdata

      - name: Run nf-test integration suite
        run: |
          nf-test test --profile test,docker --tag integration --verbose

      - name: Upload nf-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nf-test-integration-results
          path: |
            .nf-test/
            tests/output/
