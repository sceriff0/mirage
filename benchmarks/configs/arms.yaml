# =============================================================================
# arms.yaml — the REAL-SAMPLE benchmark. Three arms, one input.csv.
#
# This file is NOT sweep.yaml. They answer different questions and neither
# replaces the other:
#
#   sweep.yaml  SYNTHETIC images rescaled across a size x channel matrix.
#               "How does cost SCALE?" — the regression that sizes the resource
#               directives. Its registration offset is injected and known, so its
#               accuracy numbers describe a synthetic difficulty, not tissue.
#
#   arms.yaml   THE REAL STUDY SLIDES, registered once per CONFIGURATION.
#               "Which configuration do we ship, what does it buy, and what does
#               a real slide actually cost?" This is the arm ranking the
#               manuscript's registration figure needs.
#
# CONSUMER CONTRACT. The `registration` arms below write exactly the tree
# ihc_method's registration_arms.Rmd already reads (code/registration_arms.R):
#
#     <root>/<arm>/<patient>/qc/registration/*_seg_qc.json
#     <root>/<arm>/<patient>/registered/summary/*.csv     (VALIS arms only)
#     <root>/arms.csv                                     (written by build_arm_plan.py)
#
# That is a plain mirage --outdir per arm; Layout.patientDir() is already
# `<outdir>/<patient_id>/<kind>`, so no repackaging happens anywhere. Do not
# invent a flatter layout — the consumer reads run_qc.R's readers unchanged, and
# a second layout would be a second place for the schema to drift.
#
# COST. Real WSI runs are not sweep cells: REGISTER has been observed at 483 GB
# and MERGE_AND_PYRAMID at 6.5 h. Every arm count below is per patient, so read
# them as multipliers on your cohort. The arms are FACTORED, never crossed, and
# each stage is paid for ONCE: preprocessing runs once and every registration arm
# resumes from it; the registration arms stop at registration; the segmentation
# arms resume from ONE registration. Crossing them would repeat the expensive half
# to vary the cheap one.
# =============================================================================

# Which pipeline this plan targets. build_arm_plan.py checks these against
# nextflow.config exactly as the sweep's baseline guard does, so an arm can never
# quietly pin a param the pipeline no longer has.
baseline:
  reg_qc: 2                    # REQUIRED for every registration arm: reg_qc=2 is what
                               # emits the staged seg-overlap QC the arm ranking reads.
                               # An arm at reg_qc<2 produces no accuracy row at all.
  seg_method: instantseg       # pipeline default; the QC segmenter unless crossed below
  memory_mode: high
  reg_micro_reg: 1             # tracks nextflow.config (:wrench: 25a232e moved the shipped
                               # default 2 -> 1, micro-rigid only). The registration arms
                               # VARY this over [0,1,2] so it barely matters there -- but the
                               # segmentation and compute-profile arms inherit the baseline,
                               # and at 2 they were costing and scoring a config nobody ships.
                               # Guarded by test_arms_baseline_values_match_the_pipeline_defaults.
  registration_method: valis
  seg_qc_pairing: lsa          # pipeline default; the QC nucleus-pairing rule unless crossed
  reg_tiled_solver: legacy     # SOLVE stage the 9 STARE base arms ran: `legacy` is byte-identical to
                               # the code that produced them before 2026-09-12, so those results stay
                               # valid; `robust` enters as a solver cross (solver_cross below).
                               # below (bin/utils/cell_pairs.py: lsa | mutual_nn)

# -----------------------------------------------------------------------------
# ARM 1 — REGISTRATION. Which configuration aligns real tissue best?
#
# Runs `--start registration --stop registration`, resuming from ONE shared
# preprocessing run (`preprocess_shared`, emitted automatically by
# build_arm_plan.py). Nothing in this file touches a preproc_* param, so the 9
# registration arms would otherwise re-run an identical preprocessing step — the
# expensive half on a real WSI. Segmentation, quantification and export are not
# run either: nothing downstream of registration changes the staged registration
# QC. reg_qc=2 still segments the native slides for scoring, but that is inside
# the registration step, not the segmentation step.
#
# THE TWO VALIS KNOBS ARE NOT A GRID OF EQUALS. reg_micro_reg is a DEPTH (0 none,
# 1 micro-rigid only, 2 + micro non-rigid), so tier x depth is 3 x 3 = 9 arms.
# memory_mode is a RESOLUTION LADDER -- high / medium / low detect features and solve
# the non-rigid field at 2048 / 1024 / 512 px with the same SuperPoint+SuperGlue matcher
# at every rung (bin/utils/valis_config.py; an earlier `low` used BRISK/RANSAC, which is
# why older notes call the tiers "different matchers"). STARE's ladder below is the
# same three rungs (lib/RegPresets.groovy), so tier against tier is like-for-like --
# the same axis sweep.yaml's registration_method_grid crosses on synthetic images.
# -----------------------------------------------------------------------------
registration_arms:
  valis:
    memory_mode:   [low, medium, high]
    reg_micro_reg: [0, 1, 2]              # 9 arms
  # STARE — the other BACKEND, at its defaults. Not a seventh cell of the grid
  # above: memory_mode and reg_micro_reg are VALIS-only params, so a tiled arm
  # has neither and carries NA for both in arms.csv. It is one point of
  # comparison against the whole grid.
  #
  # The seg-overlap scorer is method-agnostic (bin/warp_seg_qc.py takes --method
  # and builds its warper from a VALIS pickle OR a STARE manifest), which is the
  # only reason a cross-backend ranking is answerable at all. What is NOT
  # comparable is the stage axis — lib/WarpBackends.groovy gives the backends
  # different stage vocabularies (valis: native/rigid/non_rigid/micro; tiled:
  # native/rigid/refined). The consumer ranks each arm on ITS OWN final stage.
  tiled:
    enabled: true
    # THREE ARMS, one per shipped tier. Was a single `tiled_defaults` arm, which left the
    # ranking tuning VALIS across six configurations and STARE across none -- the same
    # tuned-vs-untuned bias sweep.yaml guards with
    # test_project_stare_resolution_axis_mirrors_the_valis_one, and unguarded here, in the
    # block that produces the manuscript's registration figure.
    #
    # THE TIER IS THE RIGHT GRANULARITY, not the individual knobs. reg_tiled_mode is what an
    # operator actually picks, and each row of RegPresets.STARE moves all five tier-owned
    # values (tile / halo / out_tile / coarse_max_dim / upsample) coherently -- and
    # ParamUtils.validateRegPresets refuses a per-knob override under any tier but
    # `custom`, so those knobs cannot be crossed here anyway.
    #
    # TIER x REFINEMENT GATE = 9 ARMS, THE MIRROR OF THE VALIS BLOCK (2026-09-10). Three
    # tier-only arms against VALIS's nine gave VALIS three times the draws in a best-cell
    # ranking. reg_tiled_gate_tre is STARE's refinement depth -- the rigid-stage TRE (px)
    # above which a tile is non-rigidly refined; lower refines more tiles -- the counterpart
    # of reg_micro_reg, ungated, so it is legal under every tier. Same shape as
    # sweep.yaml's registration_method_grid.tiled.
    reg_tiled_mode:     [low, medium, high]
    reg_tiled_gate_tre: [0.5, 1.0, 2.0]   # brackets the default 1.0; 9 arms

    # THE COARSE FRONT-END AXIS IS GONE. It declared the three classical front-ends and
    # deferred the learned matcher on three grounds -- a separate unpublished stare-ml image,
    # a plain-profile mismatch, and a matching body that still raised NotImplementedError.
    # Every one of those has inverted: :fire: 5f7f986 deleted those three front-ends
    # and the param that selected them, and :package: 0f4c649 folded torch+kornia and the
    # DISK/LightGlue weights into the :tiled image (containers/stare-ml/ is deleted). COARSE
    # is unconditionally DISK+LightGlue now, so the axis has one value, which is not an axis.
    # It was never expanded into per-arm fan-out, so this removes no arm: tiled is still 1.


# -----------------------------------------------------------------------------
# QC INSTRUMENT CROSSES — does the registration verdict depend on HOW it was measured?
#
# The arm ranking reads the staged seg-overlap QC (reg_qc = 2): nuclei are found on
# the native slides by the run's own segmenter (subworkflows/local/seg_qc.nf --
# SEG_QC_SEGMENT is SEGMENT under an alias, so params.seg_method selects it), paired
# between reference and moving slide by params.seg_qc_pairing (bin/utils/cell_pairs.py:
# `lsa` = linear sum assignment, `mutual_nn` = mutual nearest neighbours), and the pairs
# are carried through every stage. Two measuring instruments, then: WHO found the nuclei
# and HOW they were paired. Varying either leaves the registration byte-identical, so
# these are ROBUSTNESS axes on the headline number, never a quality claim about
# registration -- exactly the category seg_qc_pairing occupies in sweep.yaml.
#
# THEY RESUME, THEY DO NOT RE-REGISTER. A cross arm is planned as arm_kind
# `registration_qc` with `resume_run` naming its base arm; run_arms.sh launches it in
# the base arm's launch directory with `-resume`, so REGISTER (483 GB on a real WSI) is
# served from the cache and only the QC chain (SEG_QC_SEGMENT for a segmenter cross,
# WARP_SEG_QC for a pairing cross, and the aggregation) runs again, publishing into
# the cross arm's own outdir. Which is why both crosses can afford `all`: the cost of a
# cross arm is one segmentation of the native slides, or one pairing pass, not a
# registration. MEASURED 2026-09-10 on the stub pipeline (trace of a -resume run with
# only the instrument changed): --seg_qc_pairing mutual_nn -> REGISTER CACHED, only
# WARP_SEG_QC re-ran; --seg_method changed -> REGISTER CACHED, SEG_QC_SEGMENT and
# WARP_SEG_QC re-ran. (A resume that misses is correct and merely slow.)
#
# ONE INSTRUMENT AT A TIME, NOT A FACTORIAL. Each cross varies its own axis off the base
# arm's other instrument: segmenters at the baseline pairing, pairings at the baseline
# segmenter. Per base arm that is 2 + 1 = 3 QC-only runs; over the 18 registration arms,
# 54 per cohort -- plus the 9 solver crosses on the STARE arms (solver_cross below), 63. The two questions -- "does WHO found the nuclei change the ranking?" and
# "does HOW they were paired change it?" -- are answered separately, which is what a
# robustness claim needs; the interaction would cost 5 runs per arm to answer a question
# the paper does not ask.
#
# COST GATE. `cross: reference` runs the extra instruments against ONE arm
# (`reference_arm`): 18 + 2 + 1 = 21 registration-step launches per cohort. `cross: all`
# crosses every arm: 18 + 36 + 18 + 9 = 81 launches, of which 54 are QC-only resumes
# and 9 are solver crosses (a full STARE registration each).
# Guarded by test_cross_all_crosses_every_arm, test_tiled_arms_are_tier_x_gate,
# test_valis_arms_are_preset_x_depth_not_a_grid_of_equals and
# test_qc_cross_arms_resume_their_base_arm.
qc_segmenter_cross:
  cross: all                               # reference | all | none
  reference_arm: valis_high_micro2         # must name an arm the grid above produces
  seg_method: [instantseg, stardist, cellsam]
  # stardist needs segmentation_model_dir and cellsam needs its weights (or a
  # valid DEEPCELL_ACCESS_TOKEN) on the cluster — see conf/ieo.config. Drop a
  # method here if it cannot run at your site; instantseg is the one that runs on
  # a fresh clone, and it is the pipeline default.

qc_pairing_cross:
  cross: all                               # reference | all | none
  reference_arm: valis_high_micro2
  seg_qc_pairing: [lsa, mutual_nn]         # the baseline (lsa) is the base arm itself

# THE SOLVE-STAGE CROSS (2026-09-12). Unlike the two QC instruments above this changes the
# REGISTRATION, not how it is measured: `robust` replaces the legacy median filter with
# neighbour-consistency rejection, in-fill, Tikhonov smoothing and an invertibility check
# (stare.solve, docs/parallel_registration_design.md §6b). It is a cross rather than a
# second STARE grid so the base arms keep their names and their already-computed results
# (they ARE the legacy solver), and the VALIS-vs-STARE draw count stays 9 vs 9. Applied to
# the STARE base arms only -- VALIS has no solve stage. Each cross arm resumes its base
# arm's launch dir; because the tile modules reference params in their script block, the
# tiled stages re-run under -resume (a full STARE registration per cross, 9 launches),
# and only preprocessing is served from the cache. Re-run after a SOLVE change with
# `--changed solve` (benchmarks/impact.py).
solver_cross:
  cross: all                               # reference | all | none
  reg_tiled_solver: [legacy, robust]       # the baseline (legacy) is the base arm itself

# -----------------------------------------------------------------------------
# ARM 2 — SEGMENTATION. Which backend segments real tissue best?
#
# Runs `--start segmentation`, resuming from the registered checkpoint ONE
# registration arm already wrote:
#
#     <root>/<from_arm>/csv/registered.csv
#
# So registration is paid for ONCE, and the comparison is not confounded by
# arms that registered differently. `from_arm` is the configuration you intend
# to ship — change it if the arm ranking picks a different winner, and re-run
# only this arm.
segmentation_arms:
  from_arm:   valis_high_micro2
  seg_method: [instantseg, stardist, cellsam]   # 3 runs/patient

  # SCORING, on tissue with no ground truth. Two reference-free signals:
  #
  #   agreement  cross-method agreement (cell-count ratio, instance F1) — already
  #              emitted by make_tables.py as segmentation_agreement.csv. Needs no
  #              new code and no GT: "do the backends agree, and where not?"
  #   cse        CellSegmentationEvaluator — a reference-free QUALITY score, so it
  #              can rank methods rather than only compare them. OPTIONAL and
  #              off by default: it needs the `segeval` container published and
  #              params.skip_seg_quality_eval=false. See docs/benchmarks_real.md.
  score_with: [agreement, cse]

# -----------------------------------------------------------------------------
# ARM 3 — COMPUTE PROFILE. What does a real slide actually cost, per process?
#
# The FULL pipeline (no --start/--stop gate) under Nextflow tracing, so every
# process contributes a trace row — this is the only arm that measures the
# processes the two arms above skip (SEGMENT, quantification, export,
# MERGE_AND_PYRAMID). Its output feeds the same make_figures/make_tables path the
# synthetic sweep uses, so measurements.csv gains real-tissue rows alongside the
# synthetic ones, distinguished by `varied_axis=real_compute`.
#
# WHY MORE THAN ONE PATIENT. With one patient you get a per-process cost
# breakdown but no slope, so it cannot say whether the synthetic scaling fits
# transfer to real tissue. Two patients bracketing the cohort's size range give a
# 2-point anchor against those fits, which is what makes the synthetic regression
# defensible in the paper. `patients: []` means every patient in the input.csv.
compute_profile:
  patients: []                 # e.g. [P046, P24086] — empty = all. Prefer the
                               # smallest and largest slide if you are picking.
  repeats: 1                   # >1 buys per-process variance (cache state, node
                               # contention) at full real-slide cost. Leave at 1
                               # unless a specific number looks unstable.

# -----------------------------------------------------------------------------
# ASHLAR — THE EXTERNAL BASELINE. Deliberately NOT under registration_arms.
#
# ashlar (labsyspharm) is the field-standard cyclic-IF registrar and this ranking's only
# EXTERNAL comparator. It is NOT a Mirage registration backend: :fire: 6a54479 removed that
# for v1.0.0 ("ships valis and tiled"), the schema enum is ['valis', 'tiled'], and
# tests/test_ashlar_backend_removed.py keeps it out. So it cannot be an arm in
# registration_arms above -- run_arms.sh would emit --registration_method ashlar and the
# pipeline would reject it at launch.
#
# It is instead driven directly by benchmarks/ashlar/ (retile.py + solve.py, relocated from
# bin/ when the backend was removed) and scored by the PIPELINE'S OWN reg_qc=2 scorer,
# bin/warp_seg_qc.py --method tiled. That split is the right one on its own merits:
# comparing against an external tool should not require the pipeline to ADOPT it.
#
# IT IS A ROW OF THIS PLAN, under arm_kind='external'. build_arm_plan.py::_external_arms
# emits it; run_arms.sh runs it in its own pass, after registration, dispatching to
# benchmarks/run_ashlar_arm.sh instead of Nextflow. It writes the same
# <root>/<arm>/<patient>/qc/registration/*_seg_qc.json every other arm writes, so it lands
# in the SAME table with the SAME columns and ihc_method reads it with no path added.
#
# WHY IT IS COMPARABLE AT ALL: solve.py rewrites ashlar's per-tile placements into the same
# M0 + mesh manifest STARE emits, and warp_seg_qc.py --method tiled loads that manifest
# JVM-free. Scored any other way it would produce numbers in a different metric family that
# share no column with this table -- which is exactly what the earlier out-of-band ashlar
# harness did, and why that harness was deleted rather than maintained. The
# synthetic ground-truth rung that used to score it was deleted for the same
# reason: exact EPE against an injected field cannot be ranked against tissue Dice.
#
# TILE SIZE IS A FAIRNESS KNOB, NOT A COST KNOB, which is why it is a LIST. ashlar computes
# one independent shift per tile, so a finer grid buys it more local (still piecewise-
# translational) freedom -- the direct analogue of STARE's reg_tiled_tile, swept at
# [1024, 2048, 4096] in sweep.yaml. Comparing ashlar at a fine grid against STARE at a coarse
# one silently biases the result, so these two values bracket STARE's swept range at both ends.
#
# READ IT AGAINST VALIS'S *RIGID* STAGE for the like-for-like number, and against *micro* to
# quantify what non-rigid buys: ashlar attempts no non-rigid warp at all, so reporting only
# the second overstates VALIS's advantage.
#
# It has no *_ctrl.json and no STARE gate, so it carries no gate columns. That is a real
# gap, not a formatting one: ashlar's own accept/reject behaviour is invisible here, and the
# max_discard_fraction below is the only handle on it.
external_baseline:
  ashlar:
    enabled: true

    # WHOSE NUCLEI THIS IS SCORED ON. The ashlar arm does NOT re-segment: it reuses the QC
    # nuclei this registration arm already published to
    # <root>/<from_arm>/<patient>/qc/registration/geojson/. Those geojsons come from the
    # NATIVE slides, so they are identical across registration arms that share a
    # seg_method -- which is exactly why reusing them is sound, and why scoring ashlar
    # against a fresh segmentation instead would confound the comparison with segmenter
    # noise. Same factoring, same reason, as segmentation_arms.from_arm above.
    #
    # It must name an arm THIS FILE produces; build_arm_plan.py raises if it does not.
    from_arm: valis_high_micro2

    tile_size: [1024, 4096]                # the fairness knob against reg_tiled_tile
    overlap_fraction: 0.1

    # MAXIMUM_SHIFT IS A LIST, and this is the most important knob in the block.
    #
    # It is in MICRONS and it fails SILENTLY when too small: LayerAligner replaces an
    # out-of-range tile with a MODEL PREDICTION instead of erroring. A shift-starved
    # ASHLAR run therefore does not crash -- it quietly degrades, and lands in the table
    # as a genuine loss for ASHLAR. That is the exact shape of a strawman baseline, and
    # it is undetectable from the score alone.
    #
    # Two budgets, one doubling apart, convert that silent failure into a VISIBLE one: if
    # 30 and 60 agree, the budget was not binding and the number is defensible; if they
    # disagree, 30 was starving it and the 30 row must not be reported as ASHLAR's
    # accuracy. This is cheap insurance -- ASHLAR is the only external comparator, so
    # every claim of "we beat the field standard" rests on it not having been crippled.
    maximum_shift_um: [30, 60]

    # The quality gate: the fraction of tiles ASHLAR may discard before its own solve is
    # considered unreliable. Held at the driver default (benchmarks/ashlar/solve.py's
    # DEFAULT_MAX_DISCARD_FRACTION) rather than varied -- it decides which tiles COUNT,
    # which is a correctness question, not a cost/accuracy trade. Tying it to a comparison
    # axis would silently change what is being measured, the same reason STARE's gating
    # knobs are deliberately NOT tiered in RegPresets.
