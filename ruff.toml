# Ruff configuration for the mirage pipeline.
#
# Scope: mirage's own Python (bin/ pipeline scripts, tests/). Vendored and
# generated code is excluded and held to its upstream style, not ours.

target-version = "py39"
line-length = 88

extend-exclude = [
    "bin/utils/cse", # vendored: CellSegmentationEvaluator subset
    "valis_lib",     # vendored VALIS library
    "pixie-main",    # vendored third-party
    "legacy",        # deprecated, gitignored
    "notebooks",     # analysis notebooks, not pipeline
    "work",          # Nextflow runtime dir
    "site",          # generated docs
    "benchmarks/archive", # what the paper does not report; not run (its README)
    # benchmarks/ is deliberately NOT excluded. It was, with the comment
    # "benchmarking scratch", left over from when the whole directory was
    # gitignored. It is tracked now, it carries the analysis code that produces
    # the paper's tables, and the exclusion was hiding 41 lint errors from a
    # BLOCKING gate — 15 of them in the production analysis files.
]

[lint]
# E/W: pycodestyle, F: pyflakes (unused imports/vars), I: import sorting.
select = ["E", "W", "F", "I"]
# Line length is owned by the formatter; ignore E501 so long URLs/strings in
# comments and docstrings do not produce unfixable lint noise.
ignore = ["E501"]
