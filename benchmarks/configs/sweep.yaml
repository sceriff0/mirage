# Benchmark sweep definition. strategy: ofat (one-factor-at-a-time) | grid.
#
# Coverage: input scale (target_px, n_channels) + per-stage resource knobs across
# preprocessing, registration, segmentation and quantification. Each axis maps to a
# --<name> CLI override; target_px/n_channels drive the synthetic image matrix.
#
# NOTE (registration): the registration axes only exercise real VALIS registration when
# the matrix was generated with --paired (reference+moving panel per cell, distinct
# channel names). Without --paired, registration is a single-slide passthrough no-op.
#
# REMOVED axes (preprocessing): preproc_autotune, preproc_n_iter, preproc_overlap,
# preproc_no_darkfield and preproc_pool_workers were deleted from the pipeline — BaSiC now runs at
# its own defaults and PREPROCESS's cpus are owned by conf/modules.config — so those params no
# longer exist to sweep. preproc_skip_dapi was renamed preproc_skip_nuclear (marker-driven rather
# than hardcoding 'DAPI'), and skip_preprocessing is new: a stage-level on/off, swept below.
#
# REMOVED axes: reg_use_tiled_registration, reg_tile_size, reg_n_workers (VALIS auto-tiles
# internally, so they were no-ops) and reg_parallel_warping (parallel warping was removed;
# warping is always sequential). The OLD distributed/tiled VALIS path was archived out of the
# pipeline (git tag archive/tiled-valis-2026-07-24), so reg_distributed_tiling / reg_dist_* and
# the distributed_grid / distributed_tiling_grid sweeps were removed — those params no longer exist.
#
# REGISTRATION METHODS: registration_method='valis' (feature-based rigid+non-rigid, the baseline)
# vs 'tiled' = STARE (JVM-free NumPy/skimage rigid + mesh registrar, merged from feat/tiled-registration
# @ c6477b1). STARE is NOT the old archived distributed path above — it is a distinct method that ships
# on main. Both methods are benchmarked head-to-head by registration_method_grid below (VALIS = baseline
# anchor; tiled = its own reg_tiled_* knobs).
#
# N-IMAGE REGISTRATION: n_register_images sweeps the number of slides registered together
# (1 reference + N-1 moving panels). Generate the matrix straight from this file so it has
# enough moving images — no manual sync:
#     python benchmarks/generate_matrix.py --source img.ome.tif --outdir bench_matrix \
#         --sweep benchmarks/configs/sweep.yaml
# (--sweep derives target_px, n_channels, --n-moving = max(n_register_images)-1, and --paired.)
# run_sweep.sh then builds the N-panel samplesheet per run.
strategy: ofat

# Input-scale grid for the memory/time SCALING study. Unlike the OFAT axes below
# (which move ONE knob off the baseline), this is a full cross-product so every
# (size x channels) combination is measured — the memory regression needs the 2-D
# grid, not a cross-shaped subset. Channels start at 2: single-channel does not
# exercise the multi-channel merge/registration path, so it is not benchmarked.
# generate_matrix.py --sweep builds exactly these cells; build_run_plan.py expands
# them into runs (labelled varied_axis=scaling_grid, plus the baseline cell).
scaling_grid:
  target_px:  [2048, 4096, 8192, 16384, 32768, 65536]  
  n_channels: [2, 4]                                     # 1 channel not benchmarked

# Registration-scaling grid: size x number-of-registered-rounds, at a FIXED channel
# count. n_register_images is a THIRD input-scaling dimension — REGISTER's input is
# the SUM of all rounds' bytes, and the merged image's channels grow with the number
# of rounds — so it must be measured ACROSS sizes, not only at the baseline cell.
# N=2 is omitted here because the scaling_grid already covers every (size, 2ch) cell
# at the baseline N=2 (the classic pair); this grid adds the 4- and 8-round points.
# These runs are labelled varied_axis=registration_grid and DO feed the memory
# regression (input genuinely varies with round count).
registration_grid:
  target_px:         [2048, 4096, 8192, 16384, 32768, 65536]
  n_register_images: [4, 8]
  n_channels:        [2, 4]     # benchmark N-image registration at BOTH 2 and 4 channels

# Baseline = the fixed point for ofat (one value per axis). Also the (4096, 2)
# cell of the scaling grid, so it is emitted once (labelled baseline).
baseline:
  # --- input scale (fixed here; varied by scaling_grid above) ---
  target_px: 32768 
  n_channels: 2
  # --- registration ---
  # NB: baseline mirrors the PIPELINE DEFAULTS (nextflow.config) so the 'baseline' run is the
  # shipped config. memory_mode=high and reg_qc=2 are the pipeline defaults as of 2026-07-27.
  registration_method: valis          # pipeline default: 'valis' | 'tiled' (STARE). This baseline is the
                                      # VALIS anchor; registration_method_grid below adds tiled/STARE runs.
  memory_mode: high                   # VALIS cost/accuracy tier (high|medium|low|custom), pipeline default.
                                      # The tier-owned knobs below are null in nextflow.config and take their
                                      # values from this tier's row in bin/utils/valis_config.py.
  reg_valis_max_processed_dim: null   # VALIS detection/matching size (px). null = from memory_mode (high -> 2048).
                                      # Declared so every run RECORDS what it used; only settable under
                                      # memory_mode=custom. NOT crossed anywhere: registration_method_grid.valis
                                      # varies memory_mode itself, and pinning custom to reach this knob would
                                      # collapse that axis. Recorded, deliberately unswept.
  reg_valis_max_non_rigid_dim: null   # VALIS non-rigid registration size (px). null = from memory_mode
                                      # (high -> 4096). Same custom-only rule as above.
  reg_micro_reg: 1                    # pipeline default: micro-registration DEPTH (0=none | 1=micro-rigid |
                                      # 2=+micro non-rigid). nextflow.config ships 1 (micro-rigid only) as of
                                      # :wrench: 25a232e; it shipped 2 before that, and this baseline shipped
                                      # 0 before THAT -- which made the 'baseline' run cheaper AND less
                                      # accurate than the shipped config. The baseline must BE the shipped
                                      # config, so this tracks nextflow.config and nothing else.
                                      # Replaces the old boolean skip_micro_registration (removed on main);
                                      # crossed with memory_mode by registration_method_grid.valis
                                      # (tier x depth, 3x3).
  reg_tiled_mode: high                # STARE cost/accuracy tier (high|medium|low|custom), pipeline default.
                                      # This is now the SHIPPED default for the tier-owned knobs below —
                                      # they are null in nextflow.config and take their values from this
                                      # tier's row in lib/RegPresets.groovy. See registration_method_grid,
                                      # which pins 'custom' where it varies them.
  reg_tiled_tile: null                # STARE tile core / mesh resolution (px). null = from reg_tiled_mode,
                                      # which is the pipeline default (high -> 2048). Declared here (like the
                                      # seg_* backend params) so EVERY config shares columns —
                                      # registration_method_grid crosses it, pinning reg_tiled_mode=custom.
  reg_tiled_gate_tre: 1.0             # STARE per-tile non-rigid refine gate (px), pipeline default. Only live for
                                      # tiled runs; declared for column uniformity (crossed by registration_method_grid).
  # The COARSE front-end param is GONE, not merely unswept. :fire: 5f7f986 deleted the
  # three classical front-ends and the param that selected them; COARSE is now
  # unconditionally DISK+LightGlue (bin/utils/coarse_align.py::estimate_rigid is a thin
  # reshape over _frontend_disk_lightglue). A baseline entry here would name nothing in
  # nextflow.config, which is what test_project_sweep_baseline_matches_pipeline_defaults
  # exists to catch.
  n_register_images: 2                # 1 reference + 1 moving (the classic pair)
  reg_qc: 2                           # pipeline default: staged registration QC ON — segments DAPI nuclei,
                                      # fixes correspondence at the rigid stage, re-measures dice_matched +
                                      # centroid displacement (um) per stage. Harvested into
                                      # registration_accuracy.csv (bin/warp_seg_qc.py; docs/registration_qc.md).
  seg_qc_pairing: lsa                 # pipeline default: how reg_qc=2 pairs reference/moving nuclei before
                                      # scoring. 'lsa' = optimal one-to-one assignment (Hungarian) within
                                      # the match radius; 'mutual_nn' = mutual nearest neighbour. Live at
                                      # this baseline because reg_qc=2 is.
  seg_qc_match_radius_factor: 1.5     # pipeline default: match radius as a multiple of the median nuclear
                                      # radius. Sets which pairings are admissible at all, so it bounds
                                      # both dice_matched and the displacement distribution.
  reg_jvm_heap_gb: null               # auto-size; the reg_jvm_heap_gb axis varies it (RAM elasticity)
  reg_max_image_dim: 4000             # pipeline default: VALIS's max processing dimension (px). THE
                                      # VALIS accuracy/cost tradeoff — every image is downscaled to fit
                                      # this before feature detection, so it sets both registration
                                      # runtime and the resolution the transform is solved at.
                                      # Live at this baseline (registration_method=valis); an OFAT
                                      # axis above, ungated so legal at every tier.
  reg_tiled_coarse_max_dim: null      # STARE coarse-anchor thumbnail, longest side (px). null = from
                                      # reg_tiled_mode (high -> 2048, RegPresets.STARE), the pipeline
                                      # default. The resolution M0 is solved at — STARE's counterpart to
                                      # reg_max_image_dim. TIER-OWNED: it moves with reg_tiled_mode,
                                      # which registration_method_grid.tiled crosses, so it is never
                                      # set directly here (validateRegPresets would refuse it under a
                                      # tier). Declared for column uniformity; inert at this baseline.
  # The two STARE control-point gates. PINNED AT THE DEFAULT, DELIBERATELY NOT SWEPT.
  # They are ACCURACY knobs with no cost signature -- the phase correlation they gate on
  # has already been computed by the time either applies, so neither moves memory or
  # runtime. Crossing them into registration_method_grid.tiled made them 60% of this
  # sweep (162 of 270 runs) to measure something a RESOURCE sweep does not report.
  # Their behaviour is characterised where ground truth exists instead:
  # tests/test_tile_residual_confidence.py measures real tissue 0.041 vs background
  # 0.9995 vs section edge 0.99996 on synthetic tiles. Declared here so every run
  # RECORDS the value it used, which the accuracy tables need.
  # Add them to registration_method_grid.tiled if you want the tissue-side curve --
  # it costs 6x the tiled grid.
  reg_tiled_max_error: 0.99           # CONFIDENCE gate (phase-correlation error), pipeline default
  reg_tiled_max_disp: null            # RANGE gate; null = fall back to reg_tiled_halo
  reg_tiled_solver: legacy            # SOLVE stage, PINNED to the pre-2026-09-12 path on purpose: the
                                      # sweep measures RESOURCES, the solve runs on kilobytes of control
                                      # points, and the sweep was launched before the `robust` solver
                                      # existed -- pinning `legacy` keeps every launched tiled run
                                      # reproducible without a re-run. The solver COMPARISON is the
                                      # arm benchmark's job (arms.yaml crosses legacy x robust).
  # --- registration (ASHLAR) ---
  # THE reg_ashlar_* BASELINE ENTRIES ARE GONE, with the backend. :fire: 6a54479 removed
  # ashlar from the pipeline for v1.0.0, so reg_ashlar_tile / _overlap / _max_shift_um name
  # nothing in nextflow.config and test_project_sweep_baseline_matches_pipeline_defaults
  # rejects them. The long fairness argument that lived here -- that ashlar's per-tile
  # granularity has to bracket STARE's reg_tiled_tile or the comparison is silently biased --
  # was never about this sweep, which declared no registration_method_grid.ashlar anyway.
  # It now lives where the comparator does: benchmarks/ashlar/ and arms.yaml's ashlar block.
  # --- preprocessing (BaSiC illumination correction) ---
  # The pipeline exposes exactly THREE preprocessing knobs. BaSiC's own defaults stand in for
  # everything else (darkfield estimation on, no autotune, non-overlapping FOVs) and PREPROCESS's
  # cpus are owned outright by conf/modules.config — see the REMOVED axes note at the top.
  skip_preprocessing: true            # pipeline default since 2026-09-10: BaSiC correction OFF,
                                      # CONVERT_IMAGE only (the step still emits one image per
                                      # slide). The axis below varies it back to false, so the
                                      # OFAT cell PAYS for the correction relative to a skipping
                                      # baseline -- the preprocessing counterpart to
                                      # skip_spatialdata_export: one axis that prices a stage.
  preproc_skip_nuclear: true          # pipeline default: the nuclear/fiducial channels named by
                                      # nuclear_markers bypass BaSiC. Ungated
                                      # (modules/local/preprocess.nf) — a cost AND correction-quality
                                      # knob, since flipping it puts every nuclear channel through
                                      # BaSiC and so changes the very channel the downstream chain
                                      # (registration + segmentation) consumes. Replaces
                                      # preproc_skip_dapi, which hardcoded the marker name and so
                                      # silently corrected a CELLTOX fiducial while sparing a DAPI one.
  preproc_tile_size: 1950             # pipeline default (BaSiC FOV tile size)
  # --- segmentation ---
  # seg_method mirrors the PIPELINE DEFAULT, which is 'instantseg' (nextflow.config): it is the only
  # backend that runs on a fresh clone (StarDist needs a trained model via segmentation_model_dir, and
  # CellSAM's weights are gated). StarDist is still benchmarked head-to-head by segmentation_grid below.
  seg_method: instantseg
  seg_gpu: true
  seg_n_tiles_x: 16                   # StarDist only; declared for column uniformity
  seg_n_tiles_y: 16                   # StarDist only; declared for column uniformity
  seg_cellsam_block_size: 1024        # pipeline default (only used when seg_method=cellsam)
  seg_cellsam_bbox_threshold: 0.4     # pipeline default (CellSAM precision/recall knob)
  seg_instantseg_tile_size: 512       # pipeline default (live at this baseline)
  seg_instantseg_batch_size: 16       # pipeline default: tiles per InstanSeg forward pass. Live at the
                                      # baseline now that instantseg is the default backend — it is the
                                      # GPU-throughput knob, crossed by segmentation_grid.
  # --- quantification ---
  # compartments ON at baseline so the expanded_quantification axis is valid:
  # expanded_quantification requires quantify_compartments (ParamUtils.validateCompartmentQuant).
  quantify_compartments: true         # pipeline default
  expanded_quantification: false      # pipeline default (Median only; Mean/Sum are opt-in)
  # --- SpatialData (.zarr) export ---
  # EXPORT_SPATIALDATA is ON by default on main, so it already costs wall-clock in every run; it is
  # declared here so that cost is attributable instead of anonymous.
  skip_spatialdata_export: false      # pipeline default (export ON)
  spatialdata_include_image: false    # pipeline default. TRUE materialises the whole pyramid into the
                                      # zarr store — the single largest output-size/write-time knob in
                                      # the pipeline, which is why it gets its own OFAT axis below.
  # --- OME-TIFF / GeoJSON export (output size + write time; no effect on quantification) ---
  compression: zstd                   # pipeline default OME-TIFF codec
  pyramid_resolutions: 8              # pipeline default pyramid level count
  pyramid_scale: 2                    # pipeline default downsample factor BETWEEN pyramid levels
                                      # (modules/local/merge_and_pyramid.nf). Independent of the level
                                      # COUNT above: together they set the pyramid's total size.
  tilex: 512                          # pipeline default OME-TIFF tile size (px)
  simplify_tolerance: 1.0             # pipeline default; display-only (quantification is mask-derived)
  geojson_coord_precision: 2          # pipeline default; display-only
  # --- QC render cost ---
  qc_scale_factor: 0.25               # pipeline default: downsample factor for the registration-QC
                                      # renders (modules/local/generate_registration_qc.nf). Pure QC
                                      # cost — it changes no measurement, only the rendered overlay.
  # --- output cleanup ---
  cleanup_level: none                 # The pipeline default since 2026-09-10 (it was 'final' before),
                                      # pinned in the BASELINE rather than swept as an axis, so
                                      # contract.axes() excludes it and every run shares the value.
                                      # Kept explicit: the analysis layer reads published intermediates
                                      # (segmentation masks, registered/summary/*.csv), so 'final' would
                                      # empty its tables while every run exits 0.
                                      #
                                      # The analysis layer READS published intermediates. Concretely,
                                      # analysis/lib/quality.py::_cell_masks rglobs the run's out/ for
                                      # *_cell_mask.tif to derive the per-run cell count — and
                                      # 'segmentation' is an INTERMEDIATE kind (Layout.FINAL_KINDS),
                                      # so at the shipped default those masks are never published and
                                      # the cell-count metric silently returns no rows while every run
                                      # exits 0. The (now-removed) ground-truth registration-accuracy
                                      # harness read the registered slides for the same reason.
                                      # Sweeping this would not measure a cheaper
                                      # pipeline, it would measure a broken analysis.
                                      #
                                      # The publish I/O 'final' saves is real and worth measuring one
                                      # day, but it has to be measured with an analysis that does not
                                      # depend on the files it removes. Not this sweep.

# Axes to vary (OFAT: one run per non-baseline value of each axis). These hold
# input size FIXED at the baseline cell and vary a single pipeline knob.
# NOTE: target_px / n_channels / n_register_images are NOT here — they are input-
# scaling dimensions owned by scaling_grid and registration_grid above (full grids),
# so listing them as OFAT axes would double-cover and confound the regression.
axes:
  # --- registration resource elasticity ---
  reg_jvm_heap_gb:            [16, 32, 64]        # does more BioFormats JVM heap speed up REGISTER, or
                                                  # just reserve idle RAM? (classic path; RAM response curve)
  # --- preprocessing ---
  skip_preprocessing:         [false, true]       # true skips BaSiC entirely (conversion still runs):
                                                  # prices the WHOLE PREPROCESS stage in one axis, the
                                                  # way skip_spatialdata_export prices EXPORT_SPATIALDATA
                                                  # BaSiC too: more PREPROCESS work, and it changes the
                                                  # very channel the downstream chain (registration +
                                                  # segmentation) consumes — a cost AND quality axis
  # --- segmentation ---
  seg_gpu:                    [true, false]       # NB: false may not be a true CPU run (issue #20)
  # --- quantification ---
  quantify_compartments:      [false, true]
  expanded_quantification:    [false, true]       # valid because baseline quantify_compartments=true
  # --- SpatialData export ---
  spatialdata_include_image:  [false, true]       # writes the full pyramid into the zarr store: the
                                                  # dominant output-size axis (duplicates the largest
                                                  # artifact the pipeline produces)
  # --- OME-TIFF / GeoJSON export (output size + write time; quantification is mask-derived, so the
  #     GeoJSON geometry knobs cannot change any measurement) ---
                                                  # count above, the other half of pyramid total size
  tilex:                      [256, 512, 1024]    # OME-TIFF tile size (write pattern / random-access cost)
  # --- MEASUREMENT SETTINGS (these change what is measured, so runs are NOT comparable across values;
                                                  # cost; changes no measured quantity.
  reg_qc:                     [0, 1, 2]           # CAVEAT: reg_qc<2 emits NO staged accuracy metric, so
                                                  # those runs are absent from registration_accuracy.csv.
                                                  # Cost characterisation of the QC stage only.
  # seg_qc_pairing and seg_qc_match_radius_factor are the reg_qc=2 SCORER's own knobs. They are live
  # OFAT axes (not a pinned grid) precisely because reg_qc=2 IS the baseline, so varying them off the
  # baseline reaches a param the pipeline really reads — the dead-axis rule does not bite here.
  # They differ from reg_qc above: reg_qc<2 DELETES the metric, whereas these two RE-COMPUTE it. So
  # their runs are comparable to the baseline, and the comparison is a ROBUSTNESS check on the headline
  # accuracy number ("does dice_matched depend on how we paired?"), never a quality claim about the
  # pipeline: the registration being scored is identical across these values.
  seg_qc_pairing:             [mutual_nn, lsa]    # pairing backend (bin/utils/cell_pairs.py)
  seg_qc_match_radius_factor: [1.0, 1.5, 2.0]     # match radius x median nuclear radius. Brackets the
                                                  # default in both directions, as the STARE/VALIS
                                                  # resolution axes do.
  # --- registration: the one ungated VALIS knob that is not a tier ---
  reg_max_image_dim:          [2000, 4000, 8000]  # VALIS's max processing dimension (px); brackets the
                                                  # default 4000. OFAT at the baseline tier since
                                                  # 2026-09-10 -- it used to be the third knob of the
                                                  # registration_method_grid cross; see that grid's
                                                  # header for why the tier took its place.
  # NOTE — every OTHER registration knob lives in registration_method_grid below, which crosses each
  # method's TIER with its REFINEMENT knob at the same dimensionality. A method-specific knob varied
  # off the other method's baseline would be a no-op run.
  # NOTE — registration_method is NOT an OFAT axis either: it is the key of that grid, each method run
  # with its OWN live knobs (a tiled-only knob off the VALIS baseline would be a no-op).
  # NOTE — seg_method and its per-method params (seg_n_tiles_*, seg_cellsam_*, seg_instantseg_*) are NOT
  # OFAT axes: segmentation_grid below runs each method with its OWN live params (an OFAT run of a
  # backend-specific param off the instantseg baseline would be a no-op).

# SEGMENTATION GRID — each method benchmarked with ITS OWN parameters (pinned seg_method + that method's
# live knobs crossed). All THREE shipped backends are covered: stardist crosses its tile grid, instantseg
# its tile size x GPU batch size, cellsam its block size x bbox threshold.
# stardist needs a trained model (segmentation_model_dir) and cellsam needs its weights + a valid
# DEEPCELL_ACCESS_TOKEN (or cellsam_model_path) on the cluster — see conf/ieo.config. Drop a method from
# this grid if it cannot run at your site; the instantseg entry is the one that runs on a fresh clone.
segmentation_grid:
  stardist:
    seg_n_tiles_x:            [8, 16, 32]
    seg_n_tiles_y:            [8, 16, 32]
  instantseg:
    seg_instantseg_tile_size:  [256, 512, 1024]
    seg_instantseg_batch_size: [8, 16, 32]       # tiles per forward pass — the GPU-throughput/VRAM knob
  cellsam:
    seg_cellsam_block_size:     [512, 1024, 2048]  # native tiling block (px); stay in CellSAM's [256,2048]
    seg_cellsam_bbox_threshold: [0.3, 0.4, 0.5]    # precision/recall knob — cell count vs false positives

# REGISTRATION METHOD GRID — the head-to-head method comparison. ONE grid, BOTH methods, each
# benchmarked with ITS OWN live knobs and at THE SAME DIMENSIONALITY. Exactly like segmentation_grid
# does per seg backend. An OFAT run of a method-specific knob off the other method's baseline would be
# a no-op, so per-method grids (not flat OFAT axes) are the correct structure. Like all real
# registration axes this needs a --paired matrix (a moving panel to register).
#
# ============================ THE SYMMETRY RULE ============================
# EACH METHOD'S ENTRY MUST CROSS THE SAME NUMBER OF KNOBS AT THE SAME NUMBER OF LEVELS, AND THE
# FIRST KNOB OF EACH IS ITS TIER, AT THE SAME THREE RUNGS.
#
# Both backends ship a three-rung preset ladder over the same vocabulary (RegPresets.MODES):
#
#     tier     VALIS `memory_mode` (bin/utils/valis_config.py)      STARE `reg_tiled_mode` (lib/RegPresets.groovy)
#     high     SuperPoint+SuperGlue at 2048 px (detect + non-rigid)  tile 2048, halo 256, out_tile 1024, coarse 2048, upsample 10
#     medium   same matcher at 1024 px                               tile 1024, halo 192, out_tile 768, coarse 1024, upsample 10
#     low      same matcher at 512 px                                tile 512,  halo 128, out_tile 512, coarse 512,  upsample 5
#
# i.e. since 60f624d7 (VALIS: one size per tier, same matcher throughout) both tiers are pure
# RESOLUTION LADDERS on the same 2048/1024/512 rungs. The tier is therefore the like-for-like axis:
# `memory_mode=low` against `reg_tiled_mode=low` is the same question asked of both methods. The
# second knob of each is its REFINEMENT DEPTH: VALIS's reg_micro_reg (0 none | 1 micro-rigid | 2 +
# micro non-rigid) and STARE's reg_tiled_gate_tre (the rigid-stage TRE above which a tile gets
# non-rigid refinement -- lower = more tiles refined). 3 x 3 = 9 cells per method, 18 in all.
#
# WHY NOT THE KNOB CROSS THIS GRID USED TO BE (2026-09-10). The previous `tiled` entry pinned
# reg_tiled_mode=custom and crossed reg_tiled_tile x reg_tiled_gate_tre x reg_tiled_coarse_max_dim
# (27 cells) against VALIS's memory_mode x reg_micro_reg x reg_max_image_dim (27). Equal in count,
# but the STARE PRESETS NEVER RAN: `custom` starts from the high row, so the (2048, 2048) cell was
# `high` and nothing else was a tier -- the 1024/1024 cell kept high's halo/out_tile/upsample, and
# 512 was not a level at all. A sweep that prices a method's shipped configurations must run them.
# The tier knobs (tile, coarse_max_dim, halo, out_tile, upsample) are TIER-OWNED --
# ParamUtils.validateRegPresets refuses a per-knob override under any tier but `custom` -- so a
# tier axis and a knob cross cannot live in one grid; the tier axis won, because it is what an
# operator actually chooses and what the real-sample arms already compare (docs/benchmarks_real.md).
#
# reg_max_image_dim (VALIS, ungated, live at every tier) therefore goes back to flat `axes:` as an
# OFAT knob, varied at the baseline tier. That is a deliberate downgrade from its former place in
# the cross, recorded here so it is not mistaken for the 11-of-27 asymmetry this grid once had:
# THAT asymmetry was two methods crossed at different dimensionality; this grid crosses both at
# 2 x 3, and the resolution question is now carried by the tier, on identical rungs, for both.
#
# test_project_sweep_backends_are_crossed_at_equal_dimensionality enforces the shape (same knob
# count, same levels, no holes). test_project_tiers_are_crossed_on_the_same_rungs enforces that
# the first knob of each method is its tier and that both list the same three rungs.
#
# Held at pipeline defaults, deliberately: the tier-owned STARE knobs (they move WITH the tier);
# the two STARE control-point gates (see the baseline block: accuracy knobs with no cost
# signature); reg_tiled_nuclear_index. There is no execution-shape axis -- STARE has ONE shape,
# the per-tile fan-out TILED_COARSE -> TILED_REG_TILE -> TILED_SOLVE -> TILED_STITCH -- and no
# coarse front-end axis: COARSE is unconditionally DISK+LightGlue (:fire: 5f7f986 deleted the
# classical front-ends and the param that selected them), so this sweep cannot say what the
# learned matcher bought over them; that is answerable only against pipeline history.
registration_method_grid:
  valis:
    memory_mode:       [low, medium, high]    # the tier: 512 / 1024 / 2048 px, one matcher throughout
    reg_micro_reg:     [0, 1, 2]              # refinement DEPTH: none | micro-rigid | + micro non-rigid
  tiled:
    reg_tiled_mode:    [low, medium, high]    # the tier: RegPresets.STARE rows, 512 / 1024 / 2048 px
    reg_tiled_gate_tre: [0.5, 1.0, 2.0]       # refinement gate: rigid-stage TRE (px) above which a
