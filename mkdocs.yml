site_name: MIRAGE
site_description: >-
  Nextflow pipeline for whole-slide multiplexed immunofluorescence: bounded-memory
  non-rigid registration of staining rounds with STARE, segmentation, single-cell
  quantification, and QuPath and SpatialData export.
site_author: Valerio Fassi, Yinxiu Zhan
site_url: https://mirage-pipeline.readthedocs.io/
repo_url: https://github.com/sceriff0/mirage
repo_name: sceriff0/mirage
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; Istituto Europeo di Oncologia — released under the MIT License.

# Author-facing helper files that should not become published pages
exclude_docs: |
  superpowers/
  _archive/
  perf/
  parallel_registration_design.md
  parallel_registration_research.md

# ---------------------------------------------------------------------------
# Link and navigation validation
# ---------------------------------------------------------------------------
# mkdocs 1.6 has no `error` level (it accepts warn / info / ignore). Raising these
# categories to `warn` is what makes `mkdocs build --strict` abort on them, so the
# blocking `docs` job in .github/workflows/_test-suite.yml fails on a dangling link
# or anchor.
#
# `nav.omitted_files: warn` is the orphan-page rule: a Markdown file in docs/ that
# no nav entry points at is unreachable from the site. docs/_archive/ and docs/perf/
# are excluded above (bin/ and tests/ cite the perf notes by path).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  # Monochrome, matching the method-schematic design language in
  # docs/stylesheets/extra.css (white paper / black ink). `primary: black` and
  # `accent: grey` are the closest Material presets; extra.css overrides the
  # remaining hue-carrying variables in both schemes.
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    # Search
    - search.highlight
    - search.suggest
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - include-markdown
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Get started:
      - Install: installation.md
      - Your first run: quickstart.md
  - Run on your data:
      - Samplesheet: samplesheet.md
      - Choosing methods: choosing_methods.md
      - GPU or no GPU: gpu.md
      - Running on a cluster: hpc.md
      - Checkpoints & resuming: resuming.md
      - Incremental cycles: add_cycle.md
      - Troubleshooting: troubleshooting.md
  - Understand the pipeline:
      - The steps: pipeline.md
      - Illumination correction: basic_illumination.md
      - Registration QC: registration_qc.md
      - Outputs: outputs.md
      - SpatialData & FlowPath: spatialdata.md
  - Reference:
      - Parameters: parameters.md
      - Command line: usage.md
      - Resources: resources.md
      - Format validation: validation/format_validation.md
  - Develop: developing.md
  - The paper:
      - What the paper reports: paper.md
      - Citation: citation.md

# ---------------------------------------------------------------------------
# Appearance extras
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sceriff0/mirage
      name: MIRAGE on GitHub
  generator: false

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
