# =============================================================================
# Release (test-gated, tag-driven)
# =============================================================================
# One commit flows through the whole release: `validate` pins the ref to a SHA,
# the gate tests that SHA, `bump-and-tag` refuses to tag if the branch moved,
# and the archive and images are built from the created tag, after the bump.
#
# The gate (`test-suite`) calls `_test-suite.yml`, the same reusable workflow as
# ci.yml, with one narrowing: `python-matrix: '["3.10"]'` (CI already covers
# 3.11 on the same commit). The nf-test real/integration suites are advisory
# (nightly.yml) and do not gate a release.
#
# Two entry points:
#   * workflow_dispatch (input: version) -> validate (pins main's SHA) -> the
#     shared test suite on that SHA -> test -> bump-and-tag (writes
#     manifest.version, commits, creates+pushes the tag on main) ->
#     publish-images + artifacts, BOTH FROM THE TAG -> release-notes.
#   * release:published -> the tag already exists, so `validate` pins the TAG's
#     SHA, the gate runs on the tag, bump-and-tag is skipped, verify-config
#     confirms the committed config matches the tag, and publish-images +
#     artifacts build from the same tag.
#
# `artifacts` and `publish-images` need `bump-and-tag`, which is skipped on the
# release path, so they use `if: always() && ...` with explicit result checks:
# `always()` lets a skipped dependency through, the checks stop a failed gate.
# tests/test_release_workflow_graph.py checks this structure.
# =============================================================================
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

# Least-privilege default: read-only. The two jobs that write (bump-and-tag,
# release-notes) escalate explicitly per-job below. publish-images pushes to
# Docker Hub via DOCKERHUB_* secrets (no extra GITHUB_TOKEN scope needed).
permissions:
  contents: read

# Serialize releases per ref but NEVER cancel one in flight — a half-published
# release (tag pushed, images missing) is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No workflow-level `env:`: it does not cross into `_test-suite.yml`, which
# declares its own.

jobs:
  # ===========================================================================
  # Job 1 - validate the requested/release version string, and PIN the exact
  # commit the whole release is built from.
  # ===========================================================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    # A regex check on one string plus a shallow checkout and a rev-parse.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get_version.outputs.version }}        # e.g. v1.0.0
      version_no_v: ${{ steps.get_version.outputs.version_no_v }}  # e.g. 1.0.0
      # The ref that WILL BE TAGGED: `main` on a dispatch (bump-and-tag tags
      # main), the tag itself on a published release (it already exists).
      gate_ref: ${{ steps.get_version.outputs.gate_ref }}
      # gate_ref resolved to an immutable SHA. The gate checks out this, so a
      # branch moving mid-run cannot change what is tested, and bump-and-tag
      # can prove it tags what was tested.
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            # The tag exists already; it IS what gets released, so gate on it.
            GATE_REF="$VERSION"
          else
            VERSION="${{ github.event.inputs.version }}"
            # bump-and-tag tags main, so the gate tests main, whatever branch
            # the dispatch came from. A notice, not a failure, tells the
            # operator their branch is not what gets released.
            GATE_REF="main"
            if [ "${{ github.ref_name }}" != "main" ]; then
              echo "::notice::Dispatched from '${{ github.ref_name }}', but a release always gates and tags MAIN. Nothing on '${{ github.ref_name }}' is released unless it is already merged to main."
            fi
          fi
          # One grouped redirect (shellcheck SC2129, enforced by actionlint).
          {
            echo "version=$VERSION"
            echo "version_no_v=${VERSION#v}"
            echo "gate_ref=$GATE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (gating on ref: $GATE_REF)"

      - name: Validate version format (FAIL on bad format)
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected vX.Y.Z (e.g. v1.0.0)."
            exit 1
          fi
          echo "Version format OK: $VERSION"

      - name: Checkout the ref that will be tagged
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_version.outputs.gate_ref }}

      - name: Pin the release commit
        id: pin
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit: $SHA (${{ steps.get_version.outputs.gate_ref }})"

  # ===========================================================================
  # The gate, part 1: the shared blocking test suite (`_test-suite.yml`).
  #
  # `ref` is the pinned SHA: a called workflow otherwise checks out the caller's
  # `github.ref`, and the gate would test a different commit from the one
  # `bump-and-tag` tags.
  #
  # No `secrets:` block: the only secret is the Codecov token, unused with
  # `upload-coverage: false`; `inherit` would pass the Docker Hub credentials.
  # ===========================================================================
  test-suite:
    name: Gate - test suite
    needs: validate
    uses: ./.github/workflows/_test-suite.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
      python-matrix: '["3.10"]'
      upload-coverage: false
    permissions:
      contents: read

  # ===========================================================================
  # The gate, part 2 - one job everything downstream can depend on.
  #
  # `test-suite`'s result is the called workflow's conclusion; its own
  # `suite-gate` rejects an all-skipped suite. `skipped` is not a pass here
  # either.
  # ===========================================================================
  test:
    name: Test Gate
    needs: [test-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all gate jobs passed
        run: |
          if [ "${{ needs.test-suite.result }}" != "success" ]; then
            echo "::error::The shared test suite did not pass (result: ${{ needs.test-suite.result }})"
            exit 1
          fi
          echo "All release gate checks passed."

  # ===========================================================================
  # Job 3 - bump manifest.version, commit, and create+push the git tag.
  # Only on workflow_dispatch (on a published release the tag already exists).
  # ===========================================================================
  bump-and-tag:
    name: Bump & Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # checkout + sed + commit + tag push.
    timeout-minutes: 10
    # Pushes the version-bump commit + git tag to main.
    permissions:
      contents: write
    steps:
      - name: Checkout repository (main, full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to tag a commit the gate did not test
        # If main moved while the gate ran, HEAD is untested. Re-dispatch instead.
        run: |
          TESTED="${{ needs.validate.outputs.sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TESTED" ]; then
            echo "::error::main is at $HEAD_SHA but the gate tested $TESTED."
            echo "Someone pushed to main while the release gate was running."
            echo "Re-run the release workflow so the gate tests what gets tagged."
            exit 1
          fi
          echo "main is at the tested commit: $HEAD_SHA"

      - name: Write version into nextflow.config manifest
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          # Replace the manifest version line: version = '...'
          sed -i -E "s/(version[[:space:]]*=[[:space:]]*)'[^']*'/\1'${VERSION_NO_V}'/" nextflow.config
          echo "nextflow.config manifest version now:"
          grep -E "version[[:space:]]*=" nextflow.config | head -1

      - name: Configure git identity (github-actions bot)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          if git diff --quiet -- nextflow.config; then
            echo "nextflow.config already at $VERSION_NO_V; no commit needed."
          else
            git add nextflow.config
            git commit -m "🔖 Release ${VERSION_NO_V}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; skipping creation."
          else
            git tag -a "$VERSION" -m "Release ${VERSION}"
            git push origin "$VERSION"
          fi

  # ===========================================================================
  # Verify (release trigger): the tag pre-exists, so confirm the committed
  # config matches it. Checks out the tag explicitly rather than rely on
  # `github.ref`.
  # ===========================================================================
  verify-config:
    name: Verify Config Matches Tag
    needs: [validate, test]
    runs-on: ubuntu-latest
    # checkout + one grep.
    timeout-minutes: 5
    if: github.event_name == 'release'
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Check manifest.version matches the released tag
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          CONFIG_VERSION=$(grep -E "version[[:space:]]*=" nextflow.config | head -1 | grep -oP "'\K[^']+")
          echo "Tag version:    $VERSION_NO_V"
          echo "Config version: $CONFIG_VERSION"
          if [ "$CONFIG_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Version mismatch - nextflow.config has '$CONFIG_VERSION' but tag is '$VERSION_NO_V'."
            exit 1
          fi
          echo "Config matches tag."

  # ===========================================================================
  # Job 4 - build & push all container images to Docker Hub via containers.yml.
  # This is the only caller that passes a `version`, which is what makes
  # containers.yml push.
  #
  # `needs: bump-and-tag` and `ref: <tag>`: the images must be built from the
  # version-bumped tree, and a called workflow does not see the caller's checkout.
  #
  # `needs: verify-config` covers the release trigger, where a hand-made tag can
  # disagree with nextflow.config; without it images would push anyway.
  # ===========================================================================
  publish-images:
    name: Publish Images
    needs: [validate, test, bump-and-tag, verify-config]
    # bump-and-tag is skipped on the release path, verify-config on dispatch;
    # `always()` lets those through, the result checks stop a failed gate.
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.test.result == 'success'
      && (needs.bump-and-tag.result == 'success' || needs.bump-and-tag.result == 'skipped')
      && (needs.verify-config.result == 'success' || needs.verify-config.result == 'skipped')
    uses: ./.github/workflows/containers.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      ref: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ===========================================================================
  # Job 5 - build the release tar.gz archive from the tag, after the bump.
  # ===========================================================================
  artifacts:
    name: Create Artifacts
    needs: [validate, test, bump-and-tag]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.test.result == 'success'
      && (needs.bump-and-tag.result == 'success' || needs.bump-and-tag.result == 'skipped')
    # tar of the working tree + artifact upload.
    timeout-minutes: 15
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Assert the archive carries the released version
        # A wrong nextflow.config inside a correctly named tarball is silent;
        # check before tarring.
        run: |
          VERSION_NO_V="${{ needs.validate.outputs.version_no_v }}"
          CONFIG_VERSION=$(grep -E "version[[:space:]]*=" nextflow.config | head -1 | grep -oP "'\K[^']+")
          if [ "$CONFIG_VERSION" != "$VERSION_NO_V" ]; then
            echo "::error::Archive would ship nextflow.config version '$CONFIG_VERSION' for release '$VERSION_NO_V'."
            exit 1
          fi
          echo "Archive tree is at version $CONFIG_VERSION."

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ARCHIVE_NAME="mirage-${VERSION}.tar.gz"

          # Write the archive outside the tree being archived, then move it back:
          # writing into the walked directory makes GNU tar exit 1 with
          # "file changed as we read it".
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='.nf-test' \
              --exclude='work' \
              --exclude='test_results*' \
              --exclude='*.log' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              -czvf "${RUNNER_TEMP}/${ARCHIVE_NAME}" .
          mv "${RUNNER_TEMP}/${ARCHIVE_NAME}" "./${ARCHIVE_NAME}"

          echo "Created archive: $ARCHIVE_NAME"
          ls -lh "$ARCHIVE_NAME"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: mirage-*.tar.gz

  # ===========================================================================
  # Release notes - attach the archive and append notes to the GitHub release.
  # Only meaningful on the release:published trigger (preserved behavior).
  # ===========================================================================
  release-notes:
    name: Update Release Notes
    needs: [validate, test, artifacts]
    runs-on: ubuntu-latest
    # Two GitHub API uploads.
    timeout-minutes: 10
    if: github.event_name == 'release'
    # Uploads the archive + appends the release body to the GitHub release.
    permissions:
      contents: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: mirage-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## MIRAGE Pipeline Release ${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            # Clone the repository
            git clone https://github.com/${{ github.repository }}.git
            cd mirage

            # Or download the release archive
            wget https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/mirage-${{ needs.validate.outputs.version }}.tar.gz
            ```

            ### Container images

            Published to Docker Hub under `bolt3x/mirage-<component>:1.0.0` (one descriptive tag per image).

            ### Quick Start

            ```bash
            nextflow run . -profile test,docker --outdir results
            ```

            ### Requirements

            - Nextflow >= 25.04.0
            - Docker or Singularity

            ---

            *This release was automatically tested and packaged by GitHub Actions.*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
