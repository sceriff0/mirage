# Set up Nextflow + nf-test (composite action): setup-nextflow plus
# nf-core/setup-nf-test. Nextflow defaults to 25.04.0 because nf-test 0.9.0's
# generated wrappers do not compile under edge Nextflow's strict parser.
#
# `nf-test-version` is required: a composite action does not reliably see the
# caller's env, so the caller passes env.NFTEST_VERSION in.
name: 'Set up nf-test'
description: 'Install Nextflow (via the setup-nextflow composite action) and nf-test.'

inputs:
  nextflow-version:
    description: >-
      Nextflow version to install. Defaults to the supported release: nf-test
      0.9.0's generated wrappers do not compile under edge Nextflow's strict
      parser, so no caller should pass 'latest-everything' here.
      latest-everything pipeline compatibility is covered by the nextflow-stub
      job's own matrix.
    required: false
    default: '25.04.0'
  nf-test-version:
    description: 'nf-test version to install (the caller passes env.NFTEST_VERSION).'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Nextflow
      uses: ./.github/actions/setup-nextflow
      with:
        nextflow-version: ${{ inputs.nextflow-version }}

    # Do not cache ~/.nf-test here: setup-nf-test caches it under its own key,
    # and a second cache breaks its install on a version bump
    # ("dest already exists"). See setup-nextflow's header.
    - name: Install nf-test
      uses: nf-core/setup-nf-test@v2
      with:
        version: ${{ inputs.nf-test-version }}
