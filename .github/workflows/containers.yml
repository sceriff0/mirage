# =============================================================================
# Containers (build, smoke-test, publish) — reusable workflow
# =============================================================================
# Builds every image under containers/<name>/ and, when a version is given,
# pushes it to its own Docker Hub repository as bolt3x/mirage-<component>:<version>.
#
# Smoke test: each image's containers/<dir>/smoke.sh imports the modules that
# image's bin/ scripts use. The Dockerfile runs it at build time and the `build`
# job runs it again via `docker run` against the finished image.
#
# Triggers:
#   * workflow_call  -> ci.yml (scope: changed, no version -> build only + smoke)
#                       nightly.yml (scope: all, no version -> build only)
#                       release.yml (scope: all, version -> build AND PUSH)
#   * workflow_dispatch -> build + push, version supplied by the operator
#                       (e.g. to validate an image before a version is tagged).
#
# No `push:` trigger (ci.yml already calls this on push) and no
# `release: [published]` trigger: publishing on a release goes through
# release.yml, behind its test gate. A `release` trigger carries no inputs, so
# re-adding one would also need its own branch in the version resolver.
#
# Auth: docker/login-action -> Docker Hub using DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#       repository secrets (Settings -> Secrets and variables -> Actions).
# Caching: GitHub Actions cache backend (type=gha) for fast layer reuse.
# =============================================================================
name: Containers

on:
  # Manual trigger -> build & push, version supplied by the operator.
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to publish, matching manifest.version (e.g. 1.0.0; a leading v is stripped)'
        required: true
        type: string
      only:
        description: >-
          Build ONLY these containers/ dirs (comma-separated, e.g. "segeval" or
          "segeval,tiled"). Leave empty to build every image. These are MUTABLE
          descriptive tags, so an all-images dispatch republishes eleven images you
          did not change -- narrow it unless you mean to rebuild everything.
        required: false
        default: ''
        type: string

  # Reusable entry point: ci.yml, nightly.yml and release.yml all call this.
  workflow_call:
    inputs:
      version:
        # Empty means build only. The resolver keys on `inputs`, never on
        # github.event_name (inside a called workflow that is the caller's event).
        description: 'Image version to publish. EMPTY (the default) means build only, never push.'
        required: false
        default: ''
        type: string
      ref:
        # A called workflow checks out the caller's github.ref, not what the
        # caller checked out. release.yml passes the release tag so images build
        # from the version-bumped tree. Empty means checkout's default ref.
        description: 'Git ref (tag/branch/SHA) to build the images from. Empty = the default ref.'
        required: false
        default: ''
        type: string
      scope:
        # 'all'     -> every image in containers/images.json (release, nightly, dispatch)
        # 'changed' -> only the images whose build context changed (ci.yml, on a PR)
        description: "Which images to build: 'all' or 'changed'."
        required: false
        default: 'all'
        type: string
      only:
        description: 'Comma-separated containers/ dirs to restrict an `all` build to. Empty = every image.'
        required: false
        default: ''
        type: string

# Docker Hub push needs no special GITHUB_TOKEN scope; contents:read for checkout.
permissions:
  contents: read

# Serialize per caller workflow and ref; never cancel, or a run can leave a
# half-pushed image set. `github.workflow` here is the caller's name, so CI and
# release runs of the same ref do not queue behind each other.
concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub namespace. Each image gets its own repository beneath it, named
  # docker.io/<NAMESPACE>/mirage-<component>.
  IMAGE_NAMESPACE: docker.io/bolt3x

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the version/tag, whether we should push, and WHICH images to build.
  # ---------------------------------------------------------------------------
  # This job never skips. `build` skips on an empty matrix (an empty `include:`
  # is a hard failure), and a workflow whose jobs all skipped concludes
  # `success`; `resolve` running keeps the caller's result meaningful.
  resolve:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    # A version string, a paths diff and a jq filter over an 11-entry JSON file.
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      push: ${{ steps.resolve.outputs.push }}
      smoke: ${{ steps.resolve.outputs.smoke }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve version and push flag
        id: resolve
        run: |
          # Resolve on `inputs` alone, never github.event_name: inside a called
          # workflow the event is the caller's (e.g. "release"), never
          # "workflow_call". workflow_dispatch requires `version`; ci.yml and
          # nightly.yml pass none, so empty means build only.
          # (tests/test_release_workflow_graph.py)
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            PUSH="true"
          else
            VERSION="ci-${GITHUB_SHA::7}"
            PUSH="false"
          fi
          # Strip a leading "v": modules/local/*.nf pull :<manifest.version>,
          # e.g. 1.0.0, not v1.0.0.
          VERSION="${VERSION#v}"

          # Smoke-test only on the changed-only path: `load: true` copies each
          # image into the runner's daemon, too much disk for the full matrix.
          if [ "${{ inputs.scope }}" = "changed" ]; then SMOKE="true"; else SMOKE="false"; fi

          {
            echo "version=$VERSION"
            echo "push=$PUSH"
            echo "smoke=$SMOKE"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION push=$PUSH smoke=$SMOKE scope=${{ inputs.scope }} (event=${{ github.event_name }})"

      # Fail once, naming the missing secret, rather than in every matrix leg.
      - name: Preflight registry credentials
        if: steps.resolve.outputs.push == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DOCKERHUB_USERNAME" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DOCKERHUB_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish: missing repository secret(s):$missing"
            echo "Set them with:"
            echo "  gh secret set DOCKERHUB_USERNAME --repo ${{ github.repository }} --body <docker-hub-user>"
            echo "  gh secret set DOCKERHUB_TOKEN    --repo ${{ github.repository }}"
            echo "The token needs Read & Write scope (hub.docker.com -> Account Settings ->"
            echo "Personal access tokens). Note that repositories created by a first push may"
            echo "default to PRIVATE; the cluster pulls these anonymously, so they must be public."
            exit 1
          fi
          echo "Registry credentials present for user: $DOCKERHUB_USERNAME"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Empty on every trigger but workflow_call -> actions/checkout's default.
          ref: ${{ inputs.ref }}
          # Full history: the changed-only path diffs against a base commit.
          fetch-depth: 0

      # The per-image path filter is generated from containers/images.json and
      # each Dockerfile's `COPY requirements/...` and `COPY packages/...` lines,
      # so it cannot disagree with the build. A requirements/ change rebuilds only
      # the images that COPY that file.
      - name: Generate the per-image path filter
        id: filters
        if: inputs.scope == 'changed'
        run: |
          {
            echo 'yaml<<PATHS_FILTER_EOF'
            # `any` is the non-vacuity probe. It must be exactly the union of the
            # per-image globs, never a superset like 'containers/**': otherwise a
            # change no image uses (containers/README.md) trips the check below.
            nl=$'\n'
            per_image_globs=""
            for dir in $(jq -r '.[].dir' containers/images.json); do
              per_image_globs="${per_image_globs}${nl}containers/${dir}/**"
              # Every requirements/ file this image's Dockerfile actually COPYs.
              while read -r req; do
                per_image_globs="${per_image_globs}${nl}${req}"
              done < <(grep -oE 'requirements/[A-Za-z0-9._-]+\.txt' "containers/${dir}/Dockerfile" | sort -u)
              # And every first-party packages/ directory it COPYs (none today).
              while read -r pkg; do
                per_image_globs="${per_image_globs}${nl}${pkg}/**"
              done < <(grep -oE '^COPY packages/[A-Za-z0-9._-]+' "containers/${dir}/Dockerfile" | sed 's/^COPY //' | sort -u)
            done
            echo "any:"
            echo "  - 'containers/images.json'"
            echo "  - '.github/workflows/containers.yml'"
            printf '%s\n' "${per_image_globs}" | sed '/^$/d' | sort -u \
              | while read -r glob; do echo "  - '${glob}'"; done
            for dir in $(jq -r '.[].dir' containers/images.json); do
              echo "${dir}:"
              echo "  - 'containers/${dir}/**'"
              echo "  - 'containers/images.json'"
              echo "  - '.github/workflows/containers.yml'"
              # Every requirements/ file this image's Dockerfile actually COPYs.
              grep -oE 'requirements/[A-Za-z0-9._-]+\.txt' "containers/${dir}/Dockerfile" \
                | sort -u \
                | while read -r req; do echo "  - '${req}'"; done
              # And every first-party packages/ directory it COPYs (none today).
              grep -oE '^COPY packages/[A-Za-z0-9._-]+' "containers/${dir}/Dockerfile" \
                | sed 's/^COPY //' \
                | sort -u \
                | while read -r pkg; do echo "  - '${pkg}/**'"; done
            done
            echo 'PATHS_FILTER_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect which build contexts changed
        id: changed
        if: inputs.scope == 'changed'
        # Not hand-rolled: paths-filter handles PRs, pushes, force-pushes and new
        # branches; a wrong `git diff` would build nothing and pass.
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.filters.outputs.yaml }}

      # The image list lives only in containers/images.json; every subset is a
      # filter over it.
      - name: Resolve the build matrix
        id: matrix
        env:
          CHANGED: ${{ steps.changed.outputs.changes }}
          ANY_TOUCHED: ${{ steps.changed.outputs.any }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.scope }}" = "changed" ]; then
            # `changes` is a JSON array of the filter names that matched; drop the
            # `any` probe, which is not an image.
            MATRIX=$(jq -c --argjson want "$CHANGED" \
              'map(select(.dir as $d | $want | index($d)))' containers/images.json)
            COUNT=$(echo "$MATRIX" | jq 'length')
            # Non-vacuity: if `any` matched, some per-image filter must have too;
            # otherwise the generated filter has lost an image.
            if [ "$ANY_TOUCHED" = "true" ] && [ "$COUNT" -eq 0 ]; then
              echo "::error::containers/, requirements/ or this workflow changed, but the" \
                   "generated per-image filter selected NO image. The filter generator has" \
                   "lost an image; it is derived from containers/images.json and each" \
                   "Dockerfile's COPY lines, so one of those is not saying what it used to."
              exit 1
            fi
            echo "Changed build contexts: $(echo "$MATRIX" | jq -r '[.[].dir] | join(", ")')"
          elif [ -z "${{ inputs.only }}" ]; then
            MATRIX=$(jq -c '.' containers/images.json)
            echo "Building every image."
          else
            # Fail on a name that matches nothing, rather than build nothing.
            MATRIX=$(jq -c --arg only "${{ inputs.only }}" \
              '($only | split(",") | map(gsub("^\\s+|\\s+$";""))) as $want
               | map(select(.dir as $d | $want | index($d)))' containers/images.json)
            COUNT=$(echo "$MATRIX" | jq 'length')
            WANT=$(echo "${{ inputs.only }}" | tr ',' '\n' | sed '/^\s*$/d' | wc -l | tr -d ' ')
            if [ "$COUNT" -ne "$WANT" ]; then
              echo "::error::--only='${{ inputs.only }}' matched $COUNT of $WANT name(s)." \
                   "Valid dirs: $(jq -r '[.[].dir] | join(", ")' containers/images.json)"
              exit 1
            fi
            echo "Building only: ${{ inputs.only }}"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq -r '.[] | "  \(.dir) -> \(.tag)"'

  # ---------------------------------------------------------------------------
  # Build (and conditionally smoke-test / push) each image in parallel via a matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build mirage-${{ matrix.dir }}
    needs: resolve
    # An empty `include:` is a hard failure, so skip instead; see `resolve`.
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Generous for cold GPU image builds. This also bounds release.yml's image
    # build, since a `uses:` job cannot set timeout-minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # From containers/images.json via `resolve`; no inline copy
        # (tests/test_container_build_matrix.py). The dir name is the component
        # name in the repository (mirage-<dir>) and in modules/local/*.nf
        # (tests/test_container_image_naming.py).
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Same ref `resolve` read the matrix from.
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate when we actually intend to push.
      - name: Log in to Docker Hub
        if: needs.resolve.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mirage-${{ matrix.dir }}
        uses: docker/build-push-action@v7
        with:
          # Repository root, so Dockerfiles can COPY requirements/ (shared with
          # CI). .dockerignore keeps the context small.
          context: .
          file: containers/${{ matrix.dir }}/Dockerfile
          # Pin to linux/amd64 — the pipeline runs on amd64 HPC nodes.
          platforms: linux/amd64
          # OCI provenance for the ARG/LABEL pair at the end of every Dockerfile.
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ needs.resolve.outputs.version }}
          push: ${{ needs.resolve.outputs.push == 'true' }}
          # `load: true` lets the smoke step `docker run` the image; off on the
          # publish and nightly paths (see `resolve`).
          load: ${{ needs.resolve.outputs.smoke == 'true' }}
          # `push: false` still runs the full build, so upstream breakage fails here.
          # One tag, the one the modules pull; no `:latest`.
          tags: ${{ env.IMAGE_NAMESPACE }}/mirage-${{ matrix.dir }}:${{ needs.resolve.outputs.version }}
          # Per-image cache scope: without `scope=` the images evict each other
          # from the 10 GB Actions cache. `mode=max` belongs on `cache-to` only.
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,scope=${{ matrix.dir }},mode=max

      - name: Smoke test mirage-${{ matrix.dir }}
        if: needs.resolve.outputs.smoke == 'true'
        # Same script the Dockerfile ran, now via `docker run` as the cluster
        # does: catches a broken ENTRYPOINT, unwritable $HOME or bad CMD.
        run: |
          docker run --rm \
            "${IMAGE_NAMESPACE}/mirage-${{ matrix.dir }}:${{ needs.resolve.outputs.version }}" \
            bash /usr/local/bin/mirage-smoke.sh
