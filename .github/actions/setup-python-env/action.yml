# Set up Python and install requirements/ files (composite action).
#
# `requirements` is an ordered list; each line is its own `pip install -r`.
# requirements/torch-cpu.txt carries `--index-url`, which would apply to the
# whole resolve if pulled in by `-r` from another file.
#
# No version string may appear in this file (tests/test_ci_stack_pinned.py).
#
# `cache-dependency-path: 'requirements/**'` is required: the default key hashes
# `**/requirements.txt`, which does not change when a pin does.
#
# Known cost: setup-python's pip cache key has no per-job part, so a small job
# (ruff) can be the first writer and leave a near-empty entry; python-tests then
# re-downloads torch until a pin changes. Speed only, not correctness.
name: 'Set up Python environment'
description: 'Install Python with a pip cache, then install the given requirements/ files in order.'

inputs:
  python-version:
    description: 'Python version to install.'
    required: false
    default: '3.10'
  requirements:
    description: >-
      requirements/ files to install, ONE PER LINE, in order. Each line becomes
      its own `-r` install, run separately from the others. Never name a package
      version here — every version string lives in requirements/.
    #
    # Required with no default, so every caller names its files literally in
    # its own `with:` and the CI guards can attribute each install to its job.
    required: true
  upgrade-pip:
    description: >-
      Upgrade pip, setuptools and wheel before anything else. Only the full CI
      stack needs it; a single-tool install (ruff, nf-core) does not.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements/**'

    - name: Install Python requirements
      # Passed via env, not `${{ }}` in the script, to avoid shell injection.
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
        UPGRADE_PIP: ${{ inputs.upgrade-pip }}
      run: |
        set -euo pipefail
        if [ "$UPGRADE_PIP" = "true" ]; then
          python -m pip install --upgrade pip setuptools wheel
        fi
        installed=0
        while IFS= read -r req; do
          [ -n "$req" ] || continue
          echo "::group::pip install -r $req"
          pip install -r "$req"
          echo "::endgroup::"
          installed=$((installed + 1))
        done <<< "$REQUIREMENTS"
        # Fail rather than run against whatever the runner image ships
        # (missing packages turn tests into silent skips).
        if [ "$installed" -eq 0 ]; then
          echo "::error::setup-python-env was given no requirements file to install."
          exit 1
        fi
