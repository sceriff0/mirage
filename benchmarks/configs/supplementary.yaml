# =============================================================================
# supplementary.yaml -- the manuscript's supplementary set, from ONE arm results root.
#
# Read by benchmarks/supplementary.py (run by benchmarks/submit_supplementary.sh). Nothing
# here registers or segments: every figure re-renders the arms already on disk. Leave a
# key out to take its default; the AUTHORS TO SUPPLY values of each legend are written
# beside each figure as *_values.csv.
#
#   python3 -m benchmarks.supplementary --results <root> --plan <root>/../arm_plan.csv \
#       -o supp --dry-run          # every render it would run, without running any
# =============================================================================

# The "high" configuration of each method: its shipped high tier. "best" is computed
# (highest median final-stage matched Dice over the cohort) and written to picks.csv.
# A name absent from the results root falls back to ANOTHER HIGH-TIER arm of that method
# (the best-scored one), never to a lower tier; with no high-tier arm the method is left
# out of `high` and check.csv says so.
high:
  valis: valis_high_micro2        # memory_mode high, micro-registration 2 (shipped default)
  stare: tiled_high_s128          # STARE high tier, stride 128 px (its shipped default)
  ashlar: ashlar_t1024_s15        # tile 1024, ASHLAR's own 15 um default (same arm as every figure)

# What the registration figures (mosaic, S4, S7, S8) are DRAWN at. A legend that names no
# tier means the high one (user ruling 2026-09-30), so only `high` by default; add `best`
# to also draw each method's top-scored arm. S5 plots every tier regardless: its legend
# names "the three cost tiers". S3a and S6 come from the segmentation arms, which resume
# from valis_high_micro2 (arms.yaml segmentation_arms.from_arm) -- high already.
configs: [high]

# Which methods sit side by side. Every set is drawn at every config; the anchor render
# of `all` picks the tissue, so every set shows the SAME ROIs.
sets:
  all: [valis, stare, ashlar]

# THE COHORT. Every figure uses these cases and only these: the arm picks, S8's boxes,
# S4/S7's values, S3a and the drawn cases. Empty = the patient_id set of the arms'
# samplesheet (INPUT= in submit_supplementary.sh, the same input.csv submit_arms.sh
# launches on); set it only to narrow that further.
# QUOTE EVERY ID: unquoted, YAML reads 046 as the octal number 38 (refused at launch).
patients: []                      # e.g. ['033', '046', '052', '10338', ...]

# ---- the priority figure: Before | VALIS | STARE-or-STARE | ASHLAR, Dice per cell ----
mosaic:
  configs: [high]                 # the mosaic shows each method's high tier only
  variants: 3                     # different tissue each; same tissue across sets/configs
  kinds: [overlay, checker]
  numbers: scorer                 # the reg_qc=2 matched Dice (Before = native-stage Dice)
  patch_um: [200, 500]           # one mosaic per patch size (a list draws each)
  rows: null                      # default: one row per (moving round, ROI)
  rounds: []                      # e.g. [CD8, CD3]; empty = every moving round

# ---- S4 (Fig 2b's panels, VALIS vs STARE/STARE) and S7 (another case) ---------------
S4:
  patient: null                   # the case of Figure 2b; null = the first patient
  rounds: []                      # the two panels of Figure 2b: the MOVING round's marker
  field_um: 50000                 # the big panel: the WHOLE TISSUE. A field larger than
                                  # the tissue is shrunk to it (plus a margin) and centred
                                  # on it, so a value no section reaches means "all of
                                  # it" (10000 cut a 10 mm section); 500 = a closer view
  zoom_um: 300                    # the inset, same tissue in every panel, read at FULL
                                  # resolution (300 um = 923 px at 0.325 um/px, one slide
                                  # pixel per drawn pixel; 60 = a few cells, enlarged)
  variants: 3
  numbers: scorer
  labels: editable                # the words INSIDE a panel (scale-bar text, channel
                                  # names): editable = real text in the PDF, which a
                                  # vector editor can change; burned = pixels of the
                                  # panel, as before; none = nothing written inside
S7:
  patients: []                    # empty = every case except S4's
  rounds: []
  field_um: 50000                 # as S4
  zoom_um: 300
  variants: 2
  numbers: scorer
  labels: editable                # as S4

# ---- S5: registration cost -----------------------------------------------------------
# These arms side by side, one dot per patient, one figure per measure, each stacked by
# phase: S5_cpu_reserved (run time x cores requested), S5_cpu_used (run time x cores
# measured busy), S5_task_time (run times summed, cores ignored); and S5_peak_memory (the
# largest task). Attempts that ran out of memory and were retried are not counted.
# S5_time_on_cores is an ESTIMATE of the time per patient on a machine with N cores, from
# the measured tasks (each phase takes max(longest task, core-hours / N)).
# S5_cost_by_tier_all keeps every tier.
S5:
  arms: [valis_high_micro2, tiled_high_s64]

# ---- S6: segmentation backends ------------------------------------------------------
S6:
  patient: null
  regions: 10                     # separated tissue regions, picked ONCE on the reference
                                  # and reused by every backend (S6/S6_regions.csv has
                                  # them): ten to choose from, then pin the ones the
                                  # figure shows with rois: ["y,x", ...] and regions: N
  rois: []
  field_um: 300                   # the crop's side: a neighbourhood of cells (150 = closer)
  crop_px: 1024                   # 300 um is 923 px at 0.325 um/px: drawn about 1:1

# ---- S3a: per-round DAPI retention (quantification/<pid>_round_qc.csv) ---------------
S3:
  round_order: []                 # AUTHORS: the acquisition order; empty = as written
  from_arm: seg_stardist          # the baseline segmenter's full-pipeline arm (null = the first)

# ---- gallery: the image set for EVERY case, per arm / backend / channel ----------------
# Drawn from the arms on disk (no pipeline runs). Every registration method's high arm on
# the SAME crop per moving round (one anchor pick), every segmentation backend at the SAME
# regions, every channel of the case at those regions too. ~renders are in check.csv.
gallery:
  methods: [valis, stare, ashlar]  # the high arm of each, where it exists
  overlay:
    field_um: [500, 2000]          # 500 um reads as tissue; 2000 um shows the reach
    zoom_um: 60                    # the single-cell inset beside each panel
    variants: 2                    # different tissue each; same tissue for every method
    numbers: auto                  # Dice/shift from the scorer if present, else the image
  zoom:
    field_um: [150, 300]           # 150 um = cells fill the panel; 300 um = context
    masks: [both, cell, nuclei]
    regions: 3                     # picked once per case and field, shared by backends
    crop_px: 1024                  # the crop-alone file's side
  channels:
    names: []                      # empty = every channel the case's slides carry
    arm: null                      # whose registered slides; null = the VALIS high arm
    field_um: 150                  # reuses the 150 um segmentation regions when present
    crop_px: 1024
    autoscale: [clean, percentile]

# ---- S2: secondary-only controls (extra acquisitions, not in the arms) ---------------
S2:
  csv: null                       # checkpoint-shaped CSV: patient_id,id,registered_image,channels,is_reference
  channels: [DAPI]                # + the secondary channels, e.g. [DAPI, AF488, AF555, AF647]
  patients: []
  roi: null                       # "Y,X" in the slides' own frame; null = auto
  field_um: 300
  crop_px: 768
  autoscale: [pinned, clean]      # pinned = ONE black/white point per channel across rounds
  limits: {}                      # e.g. {AF555: [100, 4000]} -- required for `pinned`

options:
  formats: png,pdf
  dpi: 150
